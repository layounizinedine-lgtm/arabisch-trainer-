window._forgotPassword=async function(){
  const emailEl=document.getElementById('authEmail');
  const email=emailEl?emailEl.value.trim():'';
  if(!email){ authError='Gib oben deine E-Mail-Adresse ein — dann schicken wir dir einen Link zum Zurücksetzen.'; authInfo=''; renderAuth(document.getElementById('app')); return; }
  if(!supa){ authError='Keine Verbindung zum Server. Bist du online?'; renderAuth(document.getElementById('app')); return; }
  authLoading=true; authError=''; authInfo=''; renderAuth(document.getElementById('app'));
  try{
    const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error) throw error;
    authLoading=false;
    authInfo='✓ E-Mail ist unterwegs an '+email+'! Öffne den Link darin — dann kannst du hier ein neues Passwort setzen. (Schau auch im Spam-Ordner nach.)';
    renderAuth(document.getElementById('app'));
  }catch(e){
    authLoading=false;
    authError=e.message||'Etwas ist schiefgelaufen. Versuch es nochmal.';
    renderAuth(document.getElementById('app'));
  }
};
window._doPasswordReset=async function(){
  const pwEl=document.getElementById('authNewPassword');
  const pw=pwEl?pwEl.value:'';
  if(pw.length<6){ authError='Passwort muss mindestens 6 Zeichen haben.'; renderAuth(document.getElementById('app')); return; }
  authLoading=true; authError=''; renderAuth(document.getElementById('app'));
  try{
    const {data,error}=await supa.auth.updateUser({password:pw});
    if(error) throw error;
    authLoading=false; authMode='login'; authError=''; authInfo='';
    if(data&&data.user){
      currentUser={id:data.user.id,email:data.user.email,name:data.user.user_metadata?.name||''};
      await cloudLoadForUser();
    }
    alert('Dein Passwort wurde geändert. Du bist jetzt angemeldet. ✦');
    render();
  }catch(e){
    authLoading=false;
    authError=e.message||'Etwas ist schiefgelaufen. Versuch es nochmal.';
    renderAuth(document.getElementById('app'));
  }
};
window._doAuth=async function(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const isSignup=authMode==='signup';
  const nameEl=document.getElementById('authName');
  const name=nameEl?nameEl.value.trim():'';
  if(!email||!password){ authError='Bitte E-Mail und Passwort eingeben.'; renderAuth(document.getElementById('app')); return; }
  if(isSignup&&!name){ authError='Bitte gib deinen Vornamen ein.'; renderAuth(document.getElementById('app')); return; }
  if(password.length<6){ authError='Passwort muss mindestens 6 Zeichen haben.'; renderAuth(document.getElementById('app')); return; }
  authLoading=true; authError=''; renderAuth(document.getElementById('app'));
  try{
    if(isSignup){
      const {data,error}=await supa.auth.signUp({email,password,options:{data:{name}}});
      if(error) throw error;
      if(data.user){
        currentUser={id:data.user.id,email:data.user.email,name};
        await cloudSyncNow(); // Ersteinrichtung: lokalen Stand hochladen
        authLoading=false; render();
      }
    } else {
      const {data,error}=await supa.auth.signInWithPassword({email,password});
      if(error) throw error;
      currentUser={id:data.user.id,email:data.user.email,name:data.user.user_metadata?.name||''};
      await cloudLoadForUser();
      authLoading=false; render();
    }
  }catch(e){
    authLoading=false;
    authError=(e.message||'Fehler bei der Anmeldung.').includes('Invalid login')?'E-Mail oder Passwort falsch.':(e.message||'Fehler bei der Anmeldung.');
    renderAuth(document.getElementById('app'));
  }
};
async function doLogout(){
  if(supa) await supa.auth.signOut();
  currentUser=null;
  render();
}

// BOOT — Backend ist fest eingebaut, kein API-Key vom Nutzer mehr nötig
let _bootComplete = false;
let _authListenerAttached = false;

// Fügt neue mitgelieferte Themen (z.B. Thema 6) zum bestehenden Account hinzu,
// ohne vorhandenen Fortschritt anzurühren. Läuft bei jedem Start, ändert aber
// nur etwas, wenn ein Thema aus VOKABELN_DATA/VERBEN_DATA beim Nutzer noch fehlt.
function ensureBuiltInThemes(){
  let changed=false;
  VOKABELN_DATA.forEach((themeData,idx)=>{
    let proj=projects.find(p=>p.name===themeData.name);
    const verbData=VERBEN_DATA[idx];
    if(!proj){
      proj={id:Date.now()+idx,name:themeData.name,vocab:[],verbs:[]};
      projects.push(proj);
      changed=true;
    }
    proj.vocab=proj.vocab||[];
    const existingVocabKeys=new Set(proj.vocab.map(v=>stripH(v.arabic)));
    themeData.vocab.forEach(v=>{
      const key=stripH(v.arabic);
      if(!existingVocabKeys.has(key)){
        proj.vocab.push(JSON.parse(JSON.stringify(v)));
        existingVocabKeys.add(key);
        changed=true;
      }
    });
    if(verbData){
      proj.verbs=proj.verbs||[];
      const existingVerbKeys=new Set(proj.verbs.map(v=>stripH(v.arabic)));
      verbData.verbs.forEach(v=>{
        const key=stripH(v.arabic);
        if(!existingVerbKeys.has(key)){
          proj.verbs.push(JSON.parse(JSON.stringify(v)));
          existingVerbKeys.add(key);
          changed=true;
        }
      });
    }
  });
  if(changed) saveProjects();
}
async function boot(){
  try{
    // Kommt der Nutzer über den "Passwort vergessen"-Link aus der E-Mail?
    const _isRecovery=/type=recovery/.test(location.hash||'');
    // Erst warten bis die Supabase-Bibliothek vollständig geladen ist (max. 3 Sekunden)
    const libReady = await waitForSupabaseLib(30);
    if(!libReady){
      console.warn('Supabase-Bibliothek konnte nicht geladen werden (window.supabase fehlt nach 3s).');
    }
    if(libReady && SUPABASE_URL!=='DEINE_SUPABASE_URL'){
      try{
        supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }catch(e){
        console.warn('Supabase-Client konnte nicht erstellt werden:', e);
      }
    }
    if(supa){
      try{
        const {data,error}=await supa.auth.getSession();
        if(error) console.warn('getSession Fehler:', error);
        if(data&&data.session&&data.session.user){
          currentUser={id:data.session.user.id,email:data.session.user.email,name:data.session.user.user_metadata?.name||''};
          await cloudLoadForUser();
        }
      }catch(e){
        console.warn('getSession warf einen Fehler:', e);
      }

      // Auth-Listener NACH der initialen Prüfung registrieren, damit er nicht
      // versehentlich während des Boot-Vorgangs eine widersprüchliche Anzeige auslöst.
      if(!_authListenerAttached){
        _authListenerAttached = true;
        supa.auth.onAuthStateChange((event, session)=>{
          if(event==='PASSWORD_RECOVERY'){
            // Nutzer kam über den Reset-Link — Formular für neues Passwort zeigen
            authMode='reset'; authError='';
            renderAuth(document.getElementById('app'));
            return;
          }
          if(!_bootComplete) return; // Ignoriere Events während des initialen Boots
          if(event==='SIGNED_OUT'){
            currentUser=null;
            renderAuth(document.getElementById('app'));
          }
          // SIGNED_IN wird bereits explizit in window._doAuth() behandelt — hier keine Doppel-Aktion nötig
        });
      }
    }
    _bootComplete = true;
    ensureBuiltInThemes();
    if(_isRecovery&&supa){
      // Reset-Link geöffnet: direkt das "Neues Passwort"-Formular zeigen
      authMode='reset'; authError='';
      renderAuth(document.getElementById('app'));
      return;
    }
    if(supa&&!currentUser){
      renderAuth(document.getElementById('app'));
    } else {
      if(!supa) console.warn('supa ist null — Login wird komplett übersprungen. libReady war:', libReady);
      render();
    }
  } catch(e) {
    document.getElementById('app').innerHTML = '<div style="color:red;padding:20px;font-size:14px">Boot-Fehler: ' + e.message + '</div>';
  }
}
boot();
</script>
</body>
</html>
