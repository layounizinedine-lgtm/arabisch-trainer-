:root{--bg:#080c14;--bg2:#0d1526;--bg3:#1a2540;--border:#1e2d4a;--text:#f8fafc;--text2:#94a3b8;--text3:#64748b;--gold:#F59E0B;--gold2:#d97706}
[data-theme="light"]{--bg:#ffffff;--bg2:#f9f9f9;--bg3:#f0f0f0;--border:#e0e0e0;--text:#111111;--text2:#222222;--text3:#444444;--gold:#c9a227;--gold2:#a3811f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;width:100%;margin:0 auto;min-height:100vh;transition:background 0.3s,color 0.3s;font-size:14px}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right}
/* ── DESIGN SYSTEM ──
   Karten: 16px Padding, 16px Radius
   Buttons: .gold-btn (Primary) & .sec-btn (Secondary), 14px Radius
   Typografie: 14px Standard, 12px Sekundär, 11px Labels */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.gold-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;color:#080c14;font-weight:800;font-size:14px;padding:14px 0;width:100%;cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
.gold-btn:active{opacity:0.85}
.sec-btn{background:var(--bg3);border:1px solid var(--border);border-radius:14px;color:var(--text);font-weight:700;font-size:14px;padding:14px 0;width:100%;cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
.sec-btn:active{opacity:0.85}
.label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.txt{font-size:14px;color:var(--text)}
.txt2{font-size:12px;color:var(--text3)}
input,textarea,select{background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px 14px;font-size:14px;width:100%;box-sizing:border-box;font-family:'Inter',sans-serif;outline:none}
#app{padding-bottom:90px;min-height:100vh}
#topbar{height:3px;background:linear-gradient(90deg,#F59E0B,#d97706,#92400e,#F59E0B);position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;width:100%;z-index:99}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:10px 0 20px;z-index:50;backdrop-filter:blur(10px)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;padding:24px;max-height:90vh;overflow-y:auto}
.quick-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform 0.1s,border-color 0.2s;-webkit-tap-highlight-color:transparent}
.quick-card:active{transform:scale(0.97)}

// Wartet bis das Supabase-CDN-Skript vollständig geladen ist (kann beim ersten App-Start etwas dauern)
function waitForSupabaseLib(maxTries){
  return new Promise((resolve)=>{
    let tries=0;
    const check=()=>{
      if(window.supabase){ resolve(true); return; }
      tries++;
      if(tries>=maxTries){ resolve(false); return; }
      setTimeout(check, 100);
    };
    check();
  });
}

  'sulaiman':'سليمان','suleiman':'سليمان','younes':'يونس','yunus':'يونس','idris':'إدريس','zakariya':'زكريا',
  'abu fulan':'أبو فلان','fulan':'فلان',
  'fatima':'فاطمة','fatimah':'فاطمة','aisha':'عائشة','ayesha':'عائشة','khadija':'خديجة','khadijah':'خديجة',
  'zainab':'زينب','zaynab':'زينب','maryam':'مريم','mariam':'مريم','mary':'مريم','safiyyah':'صفية','safiya':'صفية',
  'sara':'سارة','sarah':'سارة','layla':'ليلى','laila':'ليلى','nour':'نور','noor':'نور','amina':'أمينة','aminah':'أمينة',
  'yusra':'يسرى','hafsa':'حفصة','hafsah':'حفصة','ruqayya':'رقية','umm kulthum':'أم كلثوم',

};
function phoneticTransliterate(word){
  const multi=[
    [/sch/gi,'ش'],[/kh/gi,'خ'],[/gh/gi,'غ'],[/sh/gi,'ش'],[/th/gi,'ث'],[/dh/gi,'ذ'],
    [/ph/gi,'ف'],[/ck/gi,'ك'],[/qu/gi,'ق'],[/ou/gi,'و'],[/ee/gi,'ي'],[/oo/gi,'و'],
    [/ei/gi,'ي'],[/ay/gi,'اي'],[/aa/gi,'ا']
  ];
  let s=word;
  multi.forEach(([re,ar])=>{ s=s.replace(re,ar); });
  const single={a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  let out='';
  for(const ch of s){
    if(/[\u0600-\u06FF]/.test(ch)){ out+=ch; continue; }
    out+=single[ch.toLowerCase()]||'';
  }
  return out;
}
function transliterateNameToArabic(name){
  if(!name) return '';
  if(/[\u0600-\u06FF]/.test(name)) return name; // schon Arabisch -> unverändert
  const fullKey=name.trim().toLowerCase();
  if(NAME_DICT[fullKey]) return NAME_DICT[fullKey];
  const words=name.trim().split(/\s+/);
  return words.map(w=>NAME_DICT[w.toLowerCase()]||phoneticTransliterate(w)).join(' ');
}
function getExTr(item){ return item.exampleTranslation?(item.exampleTranslation[lang]||item.exampleTranslation.de||''):''; }

// CLOUD SYNC — speichert Lernfortschritt bei Supabase, sobald eingeloggt
// ═══════════════════════════════════════════════════════
let _cloudSyncTimer=null;
function cloudSyncDebounced(){
  if(!supa||!currentUser) return;
  clearTimeout(_cloudSyncTimer);
  _cloudSyncTimer=setTimeout(cloudSyncNow, 1500);
}
async function cloudSyncNow(){
  if(!supa||!currentUser) return;
  try{
    await supa.from('progress').upsert({
      user_id: currentUser.id,
      projects: projects,
      streak: streak,
      settings: { cardDirection, sentenceLayout, lang, theme },
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  }catch(e){ console.warn('Cloud-Sync fehlgeschlagen:', e); }
}
async function cloudLoadForUser(){
  if(!supa||!currentUser) return false;
  try{
    const { data, error } = await supa.from('progress').select('*').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(data){
      if(data.projects&&data.projects.length) projects=data.projects;
      if(data.streak) streak=data.streak;
      if(data.settings){
        cardDirection=data.settings.cardDirection||cardDirection;
        lang=data.settings.lang||lang;
        theme=data.settings.theme||theme;
        document.documentElement.setAttribute('data-theme', theme);
      }
      saveProjectsLocal(); saveStreakLocal();
      return true;
    }
  }catch(e){ console.warn('Cloud-Laden fehlgeschlagen:', e); }
  return false;
}

function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(streak.lastDate===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const yk=y.toISOString().slice(0,10);
  streak.days = streak.lastDate===yk ? streak.days+1 : 1;
  streak.lastDate=today; streak.longest=Math.max(streak.longest,streak.days); streak.todayXP=0;
  saveStreakLocal(); cloudSyncDebounced();
}
function addXP(n){
  streak.todayXP=(streak.todayXP||0)+n;
  streak.totalXP=(streak.totalXP||0)+n;
  saveStreakLocal(); cloudSyncDebounced();
  // Track daily review count for heatmap
  try{
    const today=new Date().toISOString().slice(0,10);
    const h=JSON.parse(localStorage.getItem('reviewHistory')||'{}');
    h[today]=(h[today]||0)+1;
    localStorage.setItem('reviewHistory',JSON.stringify(h));
  }catch{}
}

function isDue(c){ return !c.nextReview||Date.now()>=c.nextReview; }
// Anki-Style SRS: "Gar nicht" und "Geht so" nutzen kurze Minuten-Intervalle (Learning Steps),
// "Gut" und "Perfekt" nutzen Tage-Intervalle wie gewohnt.
// score: 0=Gar nicht, 1=Geht so, 3=Gut, 5=Perfekt
function calcNext(card,score){
  let {interval=1,easeFactor=2.5,repetitions=0,failCount=0}=card, fc=failCount;
  const MIN=60000; // 1 Minute in ms

  if(score===0){
    // Gar nicht: Karte fällt zurück in die Lernphase, kommt in 3 Minuten wieder
    repetitions=0; fc=Math.min(failCount+1,5); interval=1;
    easeFactor=Math.max(1.3,easeFactor-0.2);
    return{...card,interval,easeFactor,repetitions,nextReview:Date.now()+3*MIN,status:'neu',lastScore:score,failCount:fc};
  }
  if(score===1){
    // Geht so: kommt in 10 Minuten wieder, bleibt in der Lernphase
    repetitions=0; fc=Math.min(failCount+1,5); interval=1;
    easeFactor=Math.max(1.3,easeFactor-0.1);
    return{...card,interval,easeFactor,repetitions,nextReview:Date.now()+10*MIN,status:'neu',lastScore:score,failCount:fc};
  }
  // score===3 (Gut) oder score===5 (Perfekt): normales Tage-Intervall
  fc=Math.max(0,failCount-1);
  interval=repetitions===0?(score>=5?3:1):repetitions===1?(score>=5?3:2):Math.round(interval*easeFactor*(score>=5?1.15:0.9));
  repetitions++;
  easeFactor=Math.max(1.3,easeFactor+0.1-(5-score)*(0.08+(5-score)*0.02));
  const pf=fc>0?Math.max(0.3,1-fc*0.15):1;
  const ai=Math.max(1,Math.round(interval*pf));
  return{...card,interval:ai,easeFactor,repetitions,nextReview:Date.now()+ai*86400000,status:score>=5?'gelernt':'lernend',lastScore:score,failCount:fc};
}
function buildPool(vocab,f){
  const base=vocab.filter(v=>f==='fällig'?isDue(v):f==='alle'?true:v.status===f);
  const pool=[];
  for(const c of base){const fc=c.failCount||0,t=fc>=4?4:fc>=3?3:fc>=2?2:1;for(let i=0;i<t;i++)pool.push(c);}
  return pool.sort(()=>Math.random()-0.5);
}

// URL deiner Vercel Backend-Funktion. Nach dem Deployment hier eintragen, z.B.:
// 'https://dein-projekt.vercel.app/api/chat'
const BACKEND_URL = 'https://arabisch-backend-three.vercel.app/api/chat';

async function callAI(prompt,maxTokens=1500){
  // Wenn ein Backend konfiguriert ist, läuft alles sicher darüber (kein API-Key im Browser)
  if(BACKEND_URL){
    const r=await fetch(BACKEND_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,maxTokens})
    });
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    if(d.text) return d.text;
    throw new Error('Unerwartete Backend-Antwort: '+JSON.stringify(d).slice(0,200));
  }
  // Fallback: direkter Aufruf mit im Browser gespeichertem Key (unsicher, nur für Entwicklung/Tests)
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':window._ak||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})
  });
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||JSON.stringify(d.error));
  if(d.content&&d.content[0]&&d.content[0].text) return d.content[0].text;
  throw new Error('Unerwartete API-Antwort: '+JSON.stringify(d).slice(0,200));
}
function pJ(text){
  const c=text.replace(/```json|```/g,'').trim();
  // Determine intended type by first non-whitespace character
  const firstChar=c.trim()[0];
  const tryParse=(s,e)=>{
    const start=c.indexOf(s), end=c.lastIndexOf(e);
    if(start===-1||end===-1||end<=start) return null;
    try{ return JSON.parse(c.slice(start,end+1)); }catch(e){ return null; }
  };
  if(firstChar==='['){
    return tryParse('[',']') || tryParse('{','}');
  }
  return tryParse('{','}') || tryParse('[',']');
}

          ${isAdj&&v.opposite&&v.opposite!==''?`<div><div style="font-size:10px;color:var(--text3);margin-bottom:2px">ضد</div><div class="ar" style="font-size:28px;color:#60a5fa;font-weight:700">${v.oppHarakat||v.opposite}</div></div>`:''}

      ${p.verwandte.map(w=>`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;color:var(--text2)">${w.deutsch}</div><div style="font-size:11px;color:var(--text3)">${w.wortart}</div></div>
        <div class="ar" style="font-size:22px;color:#60a5fa;font-weight:700">${w.arabisch}</div>

  };
  if(v.mehrData){

        <div><div class="ar" style="font-size:24px;color:var(--gold);font-weight:700">${v.harakat||v.arabic}</div><div style="font-size:13px;color:var(--text3)">${getTr(v)}</div></div>
        <button onclick="this.closest('.overlay').remove()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px">✕</button>

  m.innerHTML=`<div class="sheet" style="max-height:85vh">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div><div class="ar" style="font-size:24px;color:var(--gold);font-weight:700">${v.harakat||v.arabic}</div><div style="font-size:13px;color:var(--text3)">${getTr(v)}</div></div>
      <button onclick="this.closest('.overlay').remove()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:16px">✕</button>
    </div>
    <div id="vocabMehrContent" style="text-align:center;padding:20px;color:var(--text3)">
      <div style="font-size:13px;margin-bottom:20px">Lade Kontext für <span class="ar" style="color:var(--gold)">${v.arabic}</span>...</div>

{"bedeutungen":[{"kontext":"context label","arabisch":"with diacritics","deutsch":"meaning","beispiel":"example with diacritics"}],"verwandte":[{"arabisch":"with diacritics","deutsch":"meaning","wortart":"Nomen/Verb/Adjektiv"}]}`,1500);

  }catch(e){
    const el=document.getElementById('vocabMehrContent');
    if(el) el.innerHTML=`<div style="color:#ef4444">Fehler: ${e.message}</div>`;

}

function filterVocab(q){
  const activeChapter=window._vokFilterChapter!==undefined?window._vokFilterChapter:'all';
  const base=activeChapter==='all'?getVocab():getVocab().filter(v=>(v.chapterId||null)===activeChapter);
  const filtered=base.filter(v=>v.arabic.includes(q)||getTr(v).toLowerCase().includes(q.toLowerCase()));
  document.getElementById('vocabList').innerHTML=filtered.map(v=>vocabCard(v)).join('');
}

async function addVocab(){
  const ar=document.getElementById('arIn').value.trim();
  const tr=document.getElementById('trIn').value.trim();
  if(!ar)return;
  const btn=document.getElementById('addVBtn');
  btn.textContent='KI ergänzt...'; btn.disabled=true;
  try{
    const raw=await callAI(`For Arabic word "${ar}" (hint: "${tr||'translate'}"): Reply ONLY with JSON:
{"arabic":"${ar}","harakat":"word with FULL diacritics including tanwin e.g. كِتَابٌ","translations":{"de":"German","en":"English","ru":"Russian","ur":"Urdu"},"wordType":"Nomen/Verb/Adjektiv/etc","opposite":"Arabic opposite WITH diacritics only if Adjektiv else empty string","oppHarakat":"opposite with diacritics or empty","plural":"Arabic plural WITH diacritics or -","pluralHarakat":"plural with diacritics or -","exampleArabic":"example sentence with FULL diacritics","exampleTranslation":{"de":"German","en":"English","ru":"Russian","ur":"Urdu"}}`);
    const p=pJ(raw);
    if(p){ setVocab([{...p,id:Date.now(),status:'neu',interval:1,easeFactor:2.5,repetitions:0,failCount:0,nextReview:Date.now()},...getVocab()]); document.querySelector('.overlay').remove(); addXP(5); renderVokabeln(document.getElementById('app')); }
    else{alert('KI Fehler');btn.textContent='Karte erstellen';btn.disabled=false;}
  }catch(e){alert('Fehler: '+e.message);btn.textContent='Karte erstellen';btn.disabled=false;}
}

// ── KARTEN (Spaced Repetition) ────────────────────────────────────────────────
let lP=[],lI=0,lF=false,lS={p:0,g:0,s:0},lD=false,lFilter='fällig',lIsVerbMode=false;
const RATES=[{l:'Gar nicht',c:'#ef4444',s:0},{l:'Geht so',c:'#F59E0B',s:1},{l:'Gut',c:'#60a5fa',s:3},{l:'Perfekt',c:'#a3e635',s:5}];

// Wandelt ein Verb in eine "virtuelle Vokabelkarte" um: هُوَ-Form vorne, Übersetzung + Beispielsatz hinten
function verbToCard(v){
  const praesensHuwa=(v.konjugation&&v.konjugation.gegenwart&&v.konjugation.gegenwart[0])?v.konjugation.gegenwart[0].a:v.arabic;
  const beispiel=(v.beispiele&&v.beispiele[0])?v.beispiele[0]:null;
  return {
    id:v.id, arabic:praesensHuwa, harakat:praesensHuwa,
    translations:v.translations, wordType:'Verb',
    exampleArabic:beispiel?beispiel.a:'', exampleTranslation:beispiel?{de:beispiel.d,en:beispiel.d}:null,
    plural:'', pluralHarakat:'', opposite:'', oppHarakat:'',
    status:v.status||'neu', interval:v.interval||1, easeFactor:v.easeFactor||2.5,
    repetitions:v.repetitions||0, failCount:v.failCount||0, nextReview:v.nextReview||0,
    _isVerb:true, _origId:v.id
  };
}
function startVerbKarten(){
  lIsVerbMode=true; window._chapterFilter=null;
  tab='lernen'; subView='karten'; lFilter='fällig';
  render();
}

function renderKarten(app){
  let source=lIsVerbMode?getVerbs().map(verbToCard):getVocab();
  if(!lIsVerbMode&&window._chapterFilter!=null){ source=source.filter(v=>v.chapterId===window._chapterFilter); }
  lP=buildPool(source,lFilter); lI=0; lF=false; lS={p:0,g:0,s:0}; lD=false;
  showCard(app);
}
function showCard(app){
  const fb=['fällig','alle','neu','lernend','gelernt'].map(f=>`<button onclick="lFilter='${f}';renderKarten(document.getElementById('app'))" style="background:${lFilter===f?'var(--gold)':'var(--bg3)'};border:1px solid ${lFilter===f?'var(--gold)':'var(--border)'};color:${lFilter===f?'#080c14':'var(--text2)'};border-radius:10px;padding:6px 10px;font-weight:700;font-size:10px;cursor:pointer;white-space:nowrap;flex-shrink:0">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('');
  if(lD){
    app.innerHTML=`<div style="padding:20px 16px 100px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-top:6px"><button onclick="lIsVerbMode=false;window._chapterFilter=null;subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button><div style="display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--text)">Session abgeschlossen ${icon('trophy',20,'var(--gold)',2)}</div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">${[['Perfekt','p','#a3e635'],['Gut','g','#F59E0B'],['Schlecht','s','#ef4444']].map(([l,k,c])=>`<div class="card" style="text-align:center;padding:16px"><div style="font-size:28px;font-weight:900;color:${c}">${lS[k]}</div><div style="font-size:11px;color:var(--text3)">${l}</div></div>`).join('')}</div>
    ${lS.s>0?`<div style="background:#1a1000;border:1px solid #92400e;border-radius:12px;padding:12px;margin-bottom:14px;font-size:12px;color:var(--gold)">${ui('badCards')||'Schlechte Karten kommen öfter wieder.'}</div>`:''}
    <button class="gold-btn" onclick="renderKarten(document.getElementById('app'))">${ui('playAgain')}</button></div>`; return;
  }
  if(!lP.length){
    app.innerHTML=`<div style="padding:20px 16px 100px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-top:6px"><button onclick="lIsVerbMode=false;window._chapterFilter=null;subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button><div style="font-size:20px;font-weight:800;color:var(--text)">Lernkarten</div></div>
    <div style="display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px">${fb}</div>
    <div style="text-align:center;color:var(--text3);padding:60px 0;font-size:15px">${ui('noCards')||'Keine Karten.'}</div></div>`; return;
  }
  const card=lP[lI];
  const tr=getTr(card), exTr=getExTr(card);
  const isDe2Ar=cardDirection==='de2ar';
  const hasPlural=card.plural&&card.plural!=='-';
  // Mufrad/Jam'u nebeneinander — wird auf der arabischen Seite gezeigt (vorne bei ar2de, hinten bei de2ar)
  const mufradJamuBlock=hasPlural?`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <div style="background:var(--bg3);border-radius:10px;padding:10px 14px;text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:4px">مفرد</div><div class="ar" style="font-size:22px;color:var(--gold)">${card.harakat||card.arabic}</div></div>
      <div style="background:var(--bg3);border-radius:10px;padding:10px 14px;text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:4px">جمع</div><div class="ar" style="font-size:22px;color:#a78bfa">${card.pluralHarakat||card.plural}</div></div>
    </div>`:`<div class="ar" style="font-size:52px;color:var(--gold);font-weight:700;line-height:1.4">${card.harakat||card.arabic}</div>`;
  // Vorderseite: Arabisch (mit mufrad/jam'u falls vorhanden) ODER nur Deutsch
  const frontContent=!isDe2Ar
    ? mufradJamuBlock
    : `<div style="font-size:32px;color:var(--gold);font-weight:800;line-height:1.4">${tr}</div>`;
  const oppositeBlock=(card.wordType||'').toLowerCase().includes('adj')&&card.opposite&&card.opposite!==''?`<div style="background:var(--bg3);border-radius:10px;padding:10px 14px;text-align:center;margin-top:14px;display:inline-block"><div style="font-size:10px;color:var(--text3);margin-bottom:4px">ضد</div><div class="ar" style="font-size:20px;color:#60a5fa">${card.oppHarakat||card.opposite}</div></div>`:'';
  // Beispielsatz: gestapelt (Arabisch exakt über Deutsch, gleiche Breite/Zentrierung) oder nebeneinander mit "-"
  const sentenceBlock=card.exampleArabic?(
    sentenceLayout==='sideBySide'
      ? `<div style="background:var(--bg3);border-radius:12px;padding:14px;margin-top:14px"><div style="font-size:14px;color:var(--text);line-height:1.8"><span class="ar" style="font-size:17px">${card.exampleArabic}</span><span style="color:var(--text3)"> - </span><span style="color:var(--text3)">${exTr}</span></div></div>`
      : `<div style="background:var(--bg3);border-radius:12px;padding:14px;margin-top:14px;display:flex;flex-direction:column;align-items:center;text-align:center"><div class="ar" style="font-size:18px;color:var(--text);line-height:1.9">${card.exampleArabic}</div><div style="font-size:12px;color:var(--text3);margin-top:6px">${exTr}</div></div>`
  ):'';
  // Rückseite: NUR Deutsch + Satz (bei ar2de) — oder mufrad/jam'u + Satz (bei de2ar)
  const backContent=!isDe2Ar
    ? `<div style="width:100%;display:flex;flex-direction:column;align-items:center">
        <div style="font-size:26px;font-weight:800;color:var(--text);margin-bottom:${oppositeBlock?'0':'4px'}">${tr}</div>
        ${oppositeBlock}
        ${sentenceBlock}
      </div>`
    : `<div style="width:100%;display:flex;flex-direction:column;align-items:center">
        ${mufradJamuBlock}
        ${oppositeBlock}
        ${sentenceBlock}
      </div>`;
  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-top:6px">
      <button onclick="lIsVerbMode=false;window._chapterFilter=null;subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div style="font-size:20px;font-weight:800;color:var(--text)">${lIsVerbMode?'Verben':(window._chapterFilter!=null?((getChapters().find(c=>c.id===window._chapterFilter)||{}).name||'Lernkarten'):'Lernkarten')}</div>
      <div style="font-size:13px;font-weight:700;color:var(--gold);margin-left:auto">${lI+1}/${lP.length}</div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px">${fb}</div>
    <div style="background:var(--bg3);border-radius:4px;height:4px;margin-bottom:16px"><div style="width:${((lI+1)/lP.length)*100}%;background:${(card.failCount||0)>1?'#ef4444':'var(--gold)'};height:4px;border-radius:4px;transition:width 0.4s"></div></div>
    <div onclick="lF=!lF;showCard(document.getElementById('app'))" style="background:var(--bg2);border:1px solid ${(card.failCount||0)>1?'#7f1d1d':'var(--border)'};border-radius:20px;padding:24px;min-height:260px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin-bottom:14px">
      ${!lF?`${(card.failCount||0)>0?`<div style="font-size:10px;color:#f97316;margin-bottom:10px;font-weight:700">SCHWIERIG – ${card.failCount}x falsch</div>`:''}
      <div style="font-size:12px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:18px">${ui('tapToFlip')}</div>
      <div style="margin-bottom:10px">${frontContent}</div>
      <div style="font-size:12px;color:var(--text3)">${card.wordType||''}</div>`
      :backContent}
    </div>
    ${lF?`<div><div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px">${ui('howWell')}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">${RATES.map(r=>{
      const preview=calcNext(card,r.s);
      const diffMs=preview.nextReview-Date.now();
      let timeLabel;
      if(diffMs<3600000) timeLabel=Math.round(diffMs/60000)+'min';
      else if(diffMs<86400000) timeLabel=Math.round(diffMs/3600000)+'h';
      else timeLabel=Math.round(diffMs/86400000)+'d';
      return `<button onclick="rateCard(${r.s})" style="background:var(--bg2);border:1px solid ${r.c}44;border-radius:14px;padding:12px 4px;cursor:pointer;text-align:center">
        <div style="font-size:13px;font-weight:800;color:${r.c}">${r.l}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">${timeLabel}</div>
      </button>`;
    }).join('')}</div>
    <button onclick="lF=false;lI++;if(lI>=lP.length){lD=true;}showCard(document.getElementById('app'))" style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;width:100%;color:var(--text2);font-weight:700;cursor:pointer">${ui('skip')}</button></div>`:''}`
}
function rateCard(score){
  const card=lP[lI];
  const updated=calcNext(card,score);
  if(lIsVerbMode){
    setVerbs(getVerbs().map(v=>v.id===card._origId?{...v,status:updated.status,interval:updated.interval,easeFactor:updated.easeFactor,repetitions:updated.repetitions,failCount:updated.failCount,nextReview:updated.nextReview,lastScore:updated.lastScore}:v));
  } else {
    setVocab(getVocab().map(v=>v.id===card.id?updated:v));
  }
  if(score>=5)lS.p++;else if(score>=3)lS.g++;else lS.s++;
  addXP(score>=5?10:score>=3?5:2);
  // Anki-Style: Karten mit kurzem Lern-Intervall (Minuten) kommen direkt wieder in der aktuellen Session dran
  if(score<3){
    lP.push(updated);
  }
  lI++; lF=false;
  if(lI>=lP.length){lD=true;updateStreak();}
  showCard(document.getElementById('app'));
}

let activeTense='vergangenheit';
const TENSES=[
  {key:'vergangenheit',ar:'الْمَاضِي',label:'Vergangenheit',color:'#60a5fa'},
  {key:'gegenwart',ar:'الْمُضَارِع',label:'Gegenwart',color:'#a3e635'},
  {key:'zukunft',ar:'الْمُسْتَقْبَل',label:'Zukunft',color:'#F59E0B'},
  {key:'befehl',ar:'الْأَمْر',label:'Befehl',color:'#f472b6'},
];

function renderVerben(app){
  const verbs=getVerbs();
  const tc=TENSES.find(x=>x.key===activeTense);
  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
      <button onclick="subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div><div style="font-size:11px;color:var(--text3)">LERNEN</div><div style="font-size:20px;font-weight:800;color:var(--text)">${ui('verbs')}</div></div>
      <button onclick="showAddVerb()" class="gold-btn" style="width:auto;padding:8px 14px;margin-left:auto;font-size:13px">+ Verb</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      ${TENSES.map(tn=>`<button onclick="activeTense='${tn.key}';renderVerben(document.getElementById('app'))" style="background:${activeTense===tn.key?tn.color+'22':'var(--bg2)'};border:2px solid ${activeTense===tn.key?tn.color:'var(--border)'};border-radius:16px;padding:14px;cursor:pointer;text-align:center">
        <div class="ar" style="font-size:16px;color:${tn.color};font-weight:700;margin-bottom:4px">${tn.ar}</div>
        <div style="font-size:11px;color:var(--text3);font-weight:600">${tn.label}</div>
      </button>`).join('')}
    </div>

    ${verbs.map(v=>`<div style="display:flex;margin-bottom:10px">
      <button onclick="showVerbDetail(${v.id})" style="flex:1;background:var(--bg2);border:1px solid var(--border);border-right:none;border-radius:18px 0 0 18px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:13px;color:var(--text2)">${getTr(v)}</div>${(v.konjugation&&v.konjugation[activeTense]&&v.konjugation[activeTense][0])?`<div class="ar" style="font-size:13px;color:${tc.color};margin-top:4px">${v.konjugation[activeTense][0].a}</div>`:''}</div>
        <div style="display:flex;align-items:center;gap:8px"><div class="ar" style="font-size:28px;color:var(--gold);font-weight:700">${v.arabic}</div><div style="color:${tc.color};font-size:18px">›</div></div>
      </button>
      <button onclick="setVerbs(getVerbs().filter(x=>x.id!==${v.id}));renderVerben(document.getElementById('app'))" style="background:#3b1a1a;border:1px solid #7f1d1d;border-radius:0 18px 18px 0;padding:0 14px;cursor:pointer;color:#fca5a5;font-size:14px">✕</button>
    </div>`).join('')}
  </div>`;
}

function showVerbDetail(id){
  const verb=getVerbs().find(v=>v.id===id); if(!verb)return;
  // Only reset tense when opening a NEW verb, not when switching tabs
  if(window._verbDetailId !== id){
    window._vt=activeTense;
    // Use pre-built mehrData if available (no AI call needed), else null for on-demand load
    window._mehrData=verb.mehrData||null;
    window._mehrLoading=false;
    window._mehrError=null;
  }
  window._verbDetailId=id;

  function draw(){
  const vt=window._vt;
  const mehrData=window._mehrData;
  const mehrLoading=window._mehrLoading;
    const tc=TENSES.find(x=>x.key===vt)||TENSES[0];
    const existing=document.getElementById('verbModal'); if(existing)existing.remove();
    const m=document.createElement('div'); m.id='verbModal';
    m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:150;display:flex;flex-direction:column;overflow:hidden';
    m.innerHTML=`
    <div style="background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <div><div style="font-size:11px;color:var(--text3)">VERB</div><div style="display:flex;align-items:center;gap:10px"><div class="ar" style="font-size:26px;color:var(--gold);font-weight:700">${verb.arabic}</div><button onclick="speakAr('${verb.arabic.replace(/'/g,"\\'")}')" style="background:var(--bg3);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center">${icon('volume',16,'var(--gold)',2)}</button></div><div style="font-size:13px;color:var(--text2)">${getTr(verb)}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div onclick="window._vt='mehr';showVerbDetail(window._verbDetailId)" style="background:${vt==='mehr'?'#a78bfa':'var(--bg3)'};border:none;color:${vt==='mehr'?'white':'var(--text2)'};border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:700">···</div>
        <div onclick="document.getElementById('verbModal').remove()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:16px">✕</div>
      </div>
    </div>
    ${vt!=='mehr'?`<div style="display:flex;gap:8px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto">
      ${TENSES.map(tn=>`<div onclick="window._vt='${tn.key}';showVerbDetail(window._verbDetailId)" style="flex-shrink:0;padding:10px 16px;border-radius:20px;cursor:pointer;background:${vt===tn.key?tn.color+'33':'var(--bg3)'};border:2px solid ${vt===tn.key?tn.color:'transparent'};-webkit-tap-highlight-color:transparent">
        <div style="font-size:12px;font-weight:700;color:${vt===tn.key?tn.color:'var(--text3)'};white-space:nowrap">${tn.label}</div>
        <div class="ar" style="font-size:11px;color:${vt===tn.key?tn.color:'var(--text3)'};text-align:right;margin-top:2px">${tn.ar}</div>
      </div>`).join('')}
    </div>`:''}
    <div style="flex:1;overflow-y:auto;padding:16px">
      ${vt==='mehr'?renderMehrContent():renderTenseContent(tc,verb)}
    </div>`;
    document.body.appendChild(m);
  }

  function renderTenseContent(tc,verb){
    const vt=window._vt;
    const ORDER_N=['هُوَ','هُمَا','هُمْ','هِيَ','هُمَا','هُنَّ','أَنْتَ','أَنْتُمَا','أَنْتُمْ','أَنْتِ','أَنْتُمَا','أَنْتُنَّ','أَنَا','نَحْنُ'];
    const ORDER_B=['أَنْتَ','أَنْتُمَا','أَنْتُمْ','أَنْتِ','أَنْتُنَّ'];
    const ORDER=vt==='befehl'?ORDER_B:ORDER_N;
    const raw=(verb.konjugation&&verb.konjugation[vt])||[];
    const strip=s=>(s||'').replace(/[\u064B-\u065F\u0670]/g,'').trim();
    const usedIdx=new Set();
    const sorted=raw.map(f=>{
      let bestI=-1;
      for(let i=0;i<ORDER.length;i++){
        if(!usedIdx.has(i) && strip(ORDER[i])===strip(f.p)){ bestI=i; break; }
      }
      if(bestI===-1) bestI=999;
      usedIdx.add(bestI);
      return {f,idx:bestI};
    }).sort((a,b)=>a.idx-b.idx).map(x=>x.f);
    return `<div style="font-size:12px;font-weight:700;color:${tc.color};margin-bottom:12px">${tc.label}</div>
    ${sorted.map(f=>`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:11px;color:var(--text3)">${f.p} · ${f.d}</div>
      <div class="ar" style="font-size:26px;color:${tc.color};font-weight:700">${f.a}</div>
    </div>`).join('')}
    ${verb.konjugation&&verb.konjugation.beispiele&&verb.konjugation.beispiele.length?`<div style="font-size:12px;font-weight:700;color:var(--text);margin:20px 0 10px">BEISPIELSÄTZE</div>${verb.konjugation.beispiele.map(b=>`<div class='card'><div class="ar" style="font-size:18px;color:var(--text);line-height:1.9;margin-bottom:6px">${b.a}</div><div style="font-size:12px;color:var(--text3)">${b.d}</div></div>`).join('')}`:''}
    ${verb.konjugation&&verb.konjugation.merksatz?`<div style="background:linear-gradient(135deg,#1a1f3a,#0d1226);border:1px solid #2d3a6e;border-radius:14px;padding:16px;margin-top:16px"><div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:8px">WORTSTAMM & MERKHILFE</div><div style="font-size:13px;color:#93c5fd;line-height:1.6">${verb.konjugation.merksatz}</div></div>`:''}`;
  }

  function renderMehrContent(){
    const mehrLoading=window._mehrLoading;
    const mehrData=window._mehrData;
    const mehrError=window._mehrError;
    if(mehrLoading) return `<div style="text-align:center;padding:40px;color:var(--text3)">KI lädt Kontext-Bedeutungen...</div>`;
    if(mehrError) return `<div style="text-align:center;padding:40px">
      <div style="font-size:13px;color:#fca5a5;margin-bottom:16px">${mehrError}</div>
      <button onclick="window._mehrError=null;loadMehr()" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:12px;padding:14px 24px;color:white;font-weight:700;font-size:14px;cursor:pointer">Nochmal versuchen</button>
    </div>`;
    if(!mehrData) return `<div style="text-align:center;padding:40px">
      <div style="font-size:14px;color:var(--text3);margin-bottom:16px">Entdecke alle Bedeutungen und Kontexte von <span class="ar" style="color:var(--gold);font-size:18px">${verb.arabic}</span></div>
      <button onclick="loadMehr()" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:12px;padding:14px 24px;color:white;font-weight:700;font-size:14px;cursor:pointer">Kontext laden</button>
    </div>`;
    return `<div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:12px">BEDEUTUNGEN & KONTEXT</div>
      ${(mehrData.bedeutungen||[]).map(b=>`<div style="background:var(--bg2);border:1px solid #3b2d6e;border-radius:14px;padding:14px;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:#a78bfa;margin-bottom:6px">${b.kontext}</div>
        <div class="ar" style="font-size:20px;color:var(--gold);margin-bottom:4px">${b.arabisch}</div>
        <div style="font-size:12px;color:var(--text3)">${b.deutsch}</div>
        ${b.beispiel?`<div class="ar" style="font-size:14px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${b.beispiel}</div>`:''}
      </div>`).join('')||''}
      ${mehrData.verwandte&&mehrData.verwandte.length?`<div style="font-size:12px;font-weight:700;color:var(--text);margin:16px 0 10px">VERWANDTE WÖRTER (نفس الجذر)</div>
      ${mehrData.verwandte.map(w=>`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;color:var(--text3)">${w.deutsch}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${w.wortart}</div></div>
        <div class="ar" style="font-size:22px;color:#60a5fa;font-weight:700">${w.arabisch}</div>
      </div>`).join('')}`:''}

  const wordExplainNote = `\nWORTSCHATZ-REGEL (SEHR WICHTIG): Der Lernende kennt bisher NUR diese Wörter: ${vocab||'noch keine'}.
Du MUSST dich bei deiner arabischen Antwort auf diese Wortliste beschränken. Erlaubt sind zusätzlich NUR: Personalpronomen (أَنَا، أَنْتَ، أَنْتِ، هُوَ، هِيَ، نَحْنُ، هُمْ)، Partikeln (وَ، فِي، مِنْ، إِلَى، عَلَى، مَعَ، لَا، مَا)، Grundwörter (مَرْحَبًا، نَعَمْ، لَا، كَيْفَ، أَيْنَ، شُكْرًا، حَسَنًا، جَيِّدٌ، هَذَا، هَذِهِ).
Wenn du unbedingt EIN neues, wichtiges Wort einführen möchtest (max. 1 pro Antwort), dann NUR wenn du es sofort mit einem Tag erklärst:
[[NEUWORT:عربي:bedeutung auf Deutsch]]
Das Tag kommt ganz am Ende deiner Antwort, auf eigener Zeile. Bevorzuge es aber, komplett bei bekannten Wörtern zu bleiben, statt neue einzuführen. Benutze NIEMALS ein Wort außerhalb der Liste ohne diesen Tag.`;
  const corrFormat = `\nKorrektur-Format: Wenn der Lernende einen ECHTEN Fehler macht (falsches Wort, falsche Grammatik, NICHT fehlende Harakat), schreibe deine arabische Antwort normal, und füge danach in runden Klammern auf Deutsch eine SEHR KURZE Korrektur hinzu, z.B. "(Tipp: es heißt أَنَا أَيْضًا nicht أَنَا إِيضًا)". Maximal 10 Wörter in der Klammer. Wenn kein Fehler vorliegt, KEINE Klammer hinzufügen.`;
  if(n<=5) return `Du bist ein freundlicher Arabisch-Gesprächspartner für absolute Anfänger.
Regeln:
- Antworte IMMER auf Arabisch mit vollständigen Vokalisierungszeichen (Tashkil auf JEDEM Wort).
- Maximal 1 kurzer, natürlicher Satz.${corrFormat}${wordExplainNote}${noHarakatNote}`;
  if(n<=15) return `Du bist ein freundlicher Arabisch-Gesprächspartner für Anfänger.
Regeln:
- Antworte IMMER auf Arabisch mit vollständigen Vokalisierungszeichen.
- Maximal 1-2 kurze, natürliche Sätze.${corrFormat}${wordExplainNote}${noHarakatNote}`;
  if(n<=30) return `Du bist ein Arabisch-Gesprächspartner für Lernende mit Grundkenntnissen.
Regeln:
- Antworte IMMER auf Arabisch mit vollständigen Vokalisierungszeichen.
- 2 natürliche Sätze, stelle auch mal eine Frage.${corrFormat}${wordExplainNote}${noHarakatNote}`;
  return `Du bist ein Arabisch-Gesprächspartner für fortgeschrittene Lernende.
Regeln:
- Antworte IMMER auf Arabisch mit vollständigen Vokalisierungszeichen.
- Natürliche Konversation, 2-3 Sätze.${corrFormat}${wordExplainNote}${noHarakatNote}`;
}

async function startChat(){
  vChatStarted=true; vMsgs=[]; vLoad=true;
  renderSprechen(document.getElementById('app'));
  try{
    const raw=await callAI(getBotPrompt()+'\n\nBegrüße den Lernenden kurz auf Arabisch und stell eine einfache Frage.',200);
    let text2=raw.trim();
    const newWords=[];
    text2=text2.replace(/\[\[NEUWORT:([^:]+):([^\]]+)\]\]/g,(m,ar,de)=>{newWords.push({ar:ar.trim(),de:de.trim()});return '';}).trim();
    vMsgs=[{role:'ai',text:text2,newWords}];
    speakAr(text2);
  }catch{vMsgs=[{role:'ai',text:'مَرْحَبًا! كَيْفَ حَالُكَ؟'}];}
  vLoad=false;
  renderSprechen(document.getElementById('app'));
}

window._sendV = function(text){ sendVoice(text); };

async function sendVoice(text){
  if(!text.trim()||vLoad)return;
  const inp=document.getElementById('vIn'); if(inp)inp.value='';
  vMsgs.push({role:'user',text:text.trim()});
  vLoad=true; renderSprechen(document.getElementById('app'));
  try{
    const history=vMsgs.map(m=>`${m.role==='user'?'Lernender':'Bot'}: ${m.text}`).join('\n');
    const replyRaw=await callAI(getBotPrompt()+`\n\nGesprächsverlauf:\n${history}\n\nAntworte jetzt.`,300);
    let text2=replyRaw.trim();
    // Extract new word explanation tags [[NEUWORT:arabic:meaning]]
    const newWords=[];
    text2=text2.replace(/\[\[NEUWORT:([^:]+):([^\]]+)\]\]/g,(m,ar,de)=>{newWords.push({ar:ar.trim(),de:de.trim()});return '';}).trim();
    // Extract correction in () if present
    const corrMatch=text2.match(/\(([^)]+)\)\s*$/);
    const correction=corrMatch?corrMatch[1]:null;
    const arabicOnly=correction?text2.replace(/\s*\([^)]+\)\s*$/,'').trim():text2;
    // Safety net: check for unknown words that weren't tagged by the AI
    const unknownWords=findUnknownWords(arabicOnly, newWords);
    vMsgs.push({role:'ai',text:arabicOnly,correction,newWords,unknownWords});
    speakAr(arabicOnly);
  }catch{vMsgs.push({role:'ai',text:'أَعِدِ الْمُحَاوَلَةَ.'});}
  vLoad=false; renderSprechen(document.getElementById('app'));
}

// Safety net: find Arabic words in bot reply that aren't in known vocab and weren't tagged
const ALLOWED_BASE_WORDS=['أنا','أنت','أنتِ','هو','هي','نحن','هم','و','في','من','إلى','على','مع','لا','ما','مرحبا','نعم','لا','كيف','أين','شكرا','حسنا','جيد','هذا','هذه','هل','ماذا','متى','لماذا','كم','أنتما','أنتن','هما','هن'];
function findUnknownWords(text, taggedNewWords){
  const known=new Set(getVocabUpToHere().map(v=>stripH(v.arabic)));
  const taggedSet=new Set(taggedNewWords.map(w=>stripH(w.ar)));
  const allowedSet=new Set(ALLOWED_BASE_WORDS.map(w=>stripH(w)));
  // Split text into Arabic words, strip punctuation
  const words=text.match(/[\u0600-\u06FF]+/g)||[];
  const unknown=[];
  const seen=new Set();
  for(const w of words){
    const stripped=stripH(w);
    if(stripped.length<2) continue;
    if(known.has(stripped)||taggedSet.has(stripped)||allowedSet.has(stripped)) continue;
    if(seen.has(stripped)) continue;
    seen.add(stripped);
    unknown.push(w);
  }
  return unknown;
}

// Arabische Sprachausgabe — wählt die beste verfügbare Stimme aus
let _arVoicesCache=null;
let _preferredArVoice=null;

function _rankArVoice(v){
  // Bewertet Stimmen nach Qualität: Online/Natural-Stimmen sind meist besser als lokale Robot-Stimmen
  let score=0;
  const name=v.name.toLowerCase();
  if(!v.localService) score+=10; // Cloud-Stimmen klingen fast immer natürlicher
  if(name.includes('enhanced')||name.includes('premium')||name.includes('natural')) score+=8;
  if(name.includes('google')) score+=6; // Google-Stimmen sind auf Android/Chrome meist gut
  if(name.includes('siri')) score+=6; // Siri-Stimmen auf iOS sind meist gut
  if(v.lang==='ar-SA') score+=5; // Saudi-Arabisch ist oft die klarste Hochsprache-Aussprache
  else if(v.lang==='ar-EG') score+=3;
  else if(v.lang.startsWith('ar')) score+=2;
  if(name.includes('male')||name.includes('majed')||name.includes('tarik')||name.includes('hoda')||name.includes('laila')) score+=2;
  return score;
}

function _loadArVoice(){
  const all=speechSynthesis.getVoices();
  const arVoices=all.filter(v=>v.lang.toLowerCase().startsWith('ar'));
  if(arVoices.length===0) return null;
  _arVoicesCache=arVoices;
  // Falls der Nutzer bereits eine Stimme manuell gewählt hat, diese respektieren
  const saved=localStorage.getItem('preferredVoiceName');
  if(saved){
    const match=arVoices.find(v=>v.name===saved);
    if(match) return match;
  }
  const ranked=[...arVoices].sort((a,b)=>_rankArVoice(b)-_rankArVoice(a));
  return ranked[0];
}

// Versucht sofort zu laden; falls Stimmen noch nicht bereit sind, wartet auf das voiceschanged-Event
if(typeof speechSynthesis!=='undefined'){
  _preferredArVoice=_loadArVoice();
  speechSynthesis.onvoiceschanged=()=>{ _preferredArVoice=_loadArVoice(); };
}

function speakAr(text, opts){
  if(!text) return;
  opts=opts||{};
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ar-SA';
    u.rate=opts.rate||0.82;   // etwas langsamer als normal für bessere Verständlichkeit beim Lernen
    u.pitch=opts.pitch||1;
    u.volume=1;
    // Beste verfügbare Stimme neu prüfen, falls sie erst jetzt geladen wurde
    if(!_preferredArVoice) _preferredArVoice=_loadArVoice();
    if(_preferredArVoice) u.voice=_preferredArVoice;
    speechSynthesis.speak(u);
  }catch(e){
    console.warn('Sprachausgabe fehlgeschlagen:', e);
  }
}

// Zeigt an, welche Stimme aktuell verwendet wird (nützlich für Profil-Einstellungen)
function getCurrentArVoiceName(){
  if(_preferredArVoice) return _preferredArVoice.name+' ('+_preferredArVoice.lang+')';
  return 'Keine arabische Stimme gefunden — Systemstandard wird verwendet';
}

// Testet die aktuell gewählte Stimme mit einem Beispielsatz
window._testVoice=function(){
  speakAr('مَرْحَبًا بِكَ فِي تَعَلُّمِ الْعَرَبِيَّةِ');
};

// Erlaubt manuelle Auswahl einer anderen verfügbaren Stimme
window._setVoice=function(idx){
  if(!_arVoicesCache) return;
  const chosen=_arVoicesCache[parseInt(idx)];
  if(chosen){
    _preferredArVoice=chosen;
    localStorage.setItem('preferredVoiceName', chosen.name);

};

// VOKABELN TEILEN — Export als Datei, Import mit Duplikat-Schutz
// ═══════════════════════════════════════════════════════
function exportVocab(){
  const data=JSON.stringify({exportedAt:new Date().toISOString(),app:'مركز اللغة',projects},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='meine-vokabeln-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImportVocab(){
  const input=document.getElementById('importFileInput');
  if(input) input.click();
}
function handleImportFile(event){
  const file=event.target.files&&event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      const importedProjects=data.projects||(Array.isArray(data)?data:null);
      if(!importedProjects||!importedProjects.length) throw new Error('Keine Projekte in dieser Datei gefunden.');
      let addedVocab=0, addedVerbs=0, skippedVocab=0, skippedVerbs=0;
      importedProjects.forEach(impProj=>{
        let target=projects.find(p=>p.name===impProj.name);
        if(!target){ target={id:Date.now()+Math.floor(Math.random()*100000),name:impProj.name,vocab:[],verbs:[]}; projects.push(target); }
        target.vocab=target.vocab||[]; target.verbs=target.verbs||[];
        const existingV=new Set(target.vocab.map(v=>stripH(v.arabic)));
        (impProj.vocab||[]).forEach(v=>{
          const key=stripH(v.arabic);
          if(!key||existingV.has(key)){ skippedVocab++; return; }
          target.vocab.push({...v,id:Date.now()+Math.floor(Math.random()*1000000),status:'neu',interval:1,easeFactor:2.5,repetitions:0,failCount:0,nextReview:0});
          existingV.add(key); addedVocab++;
        });
        const existingVb=new Set(target.verbs.map(v=>stripH(v.arabic)));
        (impProj.verbs||[]).forEach(v=>{
          const key=stripH(v.arabic);
          if(!key||existingVb.has(key)){ skippedVerbs++; return; }
          target.verbs.push({...v,id:Date.now()+Math.floor(Math.random()*1000000),status:'neu',interval:1,easeFactor:2.5,repetitions:0,failCount:0,nextReview:0});
          existingVb.add(key); addedVerbs++;
        });
      });
      saveProjects();
      alert(`Import fertig!\n✓ ${addedVocab} neue Vokabeln, ${addedVerbs} neue Verben hinzugefügt\n↷ ${skippedVocab+skippedVerbs} Duplikate übersprungen`);
      render();
    }catch(err){
      alert('Fehler beim Import: '+err.message);
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

- Erlaubt zusätzlich: أَنَا هُوَ هِيَ نَحْنُ وَ فِي مِنْ إِلَى عَلَى مَعَ هَذَا هَذِهِ لَا
- Jeder Satz: 4-6 Wörter, einfache Grammatik
- Antworte NUR mit JSON-Array ohne weitere Texte:
["جملة١", "جملة٢", "جملة٣", "جملة٤"]`;

    callAI(prompt, 500).then(raw=>{
      try{
        const cleaned=raw.replace(/```json|```/g,'').trim();
        const start=cleaned.indexOf('['), end=cleaned.lastIndexOf(']');
        const sentences=JSON.parse(cleaned.slice(start,end+1));
        if(!Array.isArray(sentences)||sentences.length<3) throw new Error('invalid');
        window._diktatState={
          sentences: sentences.slice(0,4),
          answers: new Array(sentences.length).fill(''),
          currentIdx: 0,
          playsLeft: 2, // 2 plays total per sentence (first auto + 1 replay)
          phase: 'dictate', // dictate | results
          results: null,
          loading: false
        };
        renderDiktat(document.getElementById('app'));
        // Auto-play first sentence
        setTimeout(()=>diktatSpeak(window._diktatState.sentences[0], window._diktatState),600);
      }catch(e){
        app.innerHTML=`<div style="padding:40px 16px;text-align:center">
          <div style="color:#ef4444;margin-bottom:16px">Fehler beim Erstellen des Diktats.</div>
          <button onclick="window._diktatState=null;subView='diktat';render()" style="background:var(--gold);border:none;border-radius:12px;padding:12px 24px;color:#080c14;font-weight:700;cursor:pointer">Nochmal versuchen</button>
        </div>`;
      }
    }).catch(()=>{
      app.innerHTML=`<div style="padding:40px 16px;text-align:center">
        <div style="color:#ef4444;margin-bottom:16px">Verbindungsfehler.</div>
        <button onclick="window._diktatState=null;subView='diktat';render()" style="background:var(--gold);border:none;border-radius:12px;padding:12px 24px;color:#080c14;font-weight:700;cursor:pointer">Nochmal versuchen</button>
      </div>`;
    });
    return;
  }

  // ── PHASE: Results ──
  if(state.phase==='results'){
    const res=state.results||[];
    app.innerHTML=`<div style="padding:20px 16px 100px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
        <button onclick="subView='spiele';render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
        <div><div style="font-size:11px;color:var(--text3)">DIKTAT</div><div style="font-size:20px;font-weight:800;color:var(--text)">Ergebnis</div></div>
      </div>
      ${state.loading?`<div style="text-align:center;padding:40px;color:var(--text3)">KI korrigiert...</div>`:`
      ${res.map((r,i)=>`
        <div style="background:var(--bg2);border:1.5px solid ${r.korrekt?'#a3e635':'#ef4444'};border-radius:16px;padding:16px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:11px;font-weight:700;color:var(--text3)">SATZ ${i+1}</span>
            <span style="font-size:12px;font-weight:700;color:${r.korrekt?'#a3e635':'#ef4444'}">${r.korrekt?'✓ Richtig':'✗ Fehler'}</span>
          </div>
          <div class="ar" style="font-size:16px;color:var(--text3);margin-bottom:4px;line-height:1.8">Deine Antwort: ${state.answers[i]||'—'}</div>
          <div class="ar" style="font-size:16px;color:var(--gold);margin-bottom:8px;line-height:1.8">Richtig: ${state.sentences[i]}</div>
          ${r.feedback?`<div style="font-size:12px;color:#94a3b8;line-height:1.6;padding-top:8px;border-top:1px solid var(--border)">${r.feedback}</div>`:''}
        </div>`).join('')}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
        <button onclick="window._diktatState=null;subView='diktat';render()" style="background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;padding:14px;color:#080c14;font-weight:800;font-size:14px;cursor:pointer">Neues Diktat</button>
        <button onclick="subView='spiele';render()" style="background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-weight:700;font-size:14px;cursor:pointer">Zurück</button>
      </div>`}
    </div>`;
    return;
  }

  // ── PHASE: Dictate (Satz für Satz) ──
  const idx=state.currentIdx;
  const total=state.sentences.length;
  const pct=Math.round((idx/total)*100);

  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
      <button onclick="subView='spiele';render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div style="flex:1">
        <div style="font-size:11px;color:var(--text3)">DIKTAT · SATZ ${idx+1} VON ${total}</div>
        <div style="background:var(--bg3);border-radius:4px;height:4px;margin-top:6px">
          <div style="width:${pct}%;background:var(--gold);height:4px;border-radius:4px"></div>
        </div>
      </div>
    </div>

    <!-- Audio area -->
    <div style="background:linear-gradient(135deg,#1a1200,#2a1f00);border:2px solid var(--gold);border-radius:22px;padding:32px 24px;margin-bottom:20px;text-align:center">
      <div style="margin-bottom:16px">${icon('mic',48,'var(--gold)',1.5)}</div>
      <div style="font-size:16px;font-weight:700;color:var(--gold);margin-bottom:8px">Höre den Satz</div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:24px">Noch ${state.playsLeft} ${state.playsLeft===1?'Wiederholung':'Wiederholungen'} möglich</div>
      <button id="replayBtn" onclick="window._diktatReplay()" style="background:${state.playsLeft>0?'var(--gold)':'var(--bg3)'};border:none;border-radius:14px;padding:14px 32px;color:${state.playsLeft>0?'#080c14':'var(--text3)'};font-weight:800;font-size:15px;cursor:${state.playsLeft>0?'pointer':'default'}">${state.playsLeft>0?'Nochmal hören':'Kein Replay mehr'}</button>
    </div>

    <!-- Write answer -->
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">Schreibe den Satz auf Arabisch:</div>
    <textarea id="diktatInput" dir="rtl" placeholder="اكتب هنا بالعربية..." style="width:100%;min-height:80px;font-size:20px;font-family:inherit;background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:14px;color:var(--text);line-height:1.8;resize:none;box-sizing:border-box">${state.answers[idx]||''}</textarea>

    <!-- Next / Submit -->
    <div style="margin-top:16px">
      ${idx<total-1
        ? `<button onclick="window._diktatNext()" style="width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;padding:16px;color:#080c14;font-weight:900;font-size:16px;cursor:pointer">Weiter →</button>`
        : `<button onclick="window._diktatSubmit()" style="width:100%;background:linear-gradient(135deg,#a3e635,#65a30d);border:none;border-radius:14px;padding:16px;color:#080c14;font-weight:900;font-size:16px;cursor:pointer">Abschicken & Korrigieren ✓</button>`
      }
    </div>
  </div>`;

  // Bind functions
  window._diktatReplay=function(){
    if(state.playsLeft<=0) return;
    state.playsLeft--;
    diktatSpeak(state.sentences[idx], state);
    renderDiktat(document.getElementById('app'));
    // Keep focus on textarea
    setTimeout(()=>{const t=document.getElementById('diktatInput');if(t)t.focus();},100);
  };

  window._diktatNext=function(){
    const input=document.getElementById('diktatInput');
    state.answers[idx]=input?input.value.trim():'';
    state.currentIdx++;
    state.playsLeft=2;
    renderDiktat(document.getElementById('app'));
    // Auto-play next sentence
    setTimeout(()=>diktatSpeak(state.sentences[state.currentIdx], state),600);
  };

  window._diktatSubmit=async function(){
    const input=document.getElementById('diktatInput');
    state.answers[idx]=input?input.value.trim():'';
    state.phase='results';
    state.loading=true;
    renderDiktat(document.getElementById('app'));

    // Build correction prompt
    const pairs=state.sentences.map((s,i)=>`Satz ${i+1}:\nOriginal: ${s}\nAntwort des Lernenden: ${state.answers[i]||'(keine Antwort)'}`).join('\n\n');
    const prompt=`Du bist ein Arabisch-Lehrer. Korrigiere dieses Diktat. Für jeden Satz: War die Antwort korrekt (ignoriere fehlende Harakat, akzeptiere sinngemäß gleiche Schreibweise)? Gib kurzes Feedback auf Deutsch.

${pairs}

Antworte NUR mit JSON-Array:
[{"korrekt":true,"feedback":""},{"korrekt":false,"feedback":"Kurze Erklärung des Fehlers"}]`;

    try{
      const raw=await callAI(prompt,600);
      const cleaned=raw.replace(/```json|```/g,'').trim();
      const start=cleaned.indexOf('['), end=cleaned.lastIndexOf(']');
      state.results=JSON.parse(cleaned.slice(start,end+1));
    }catch{
      state.results=state.sentences.map((_,i)=>({korrekt:false,feedback:'Korrektur konnte nicht geladen werden.'}));
    }
    state.loading=false;
    renderDiktat(document.getElementById('app'));
  };
}

function diktatSpeak(text, state){
  if(!text) return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='ar-SA'; utt.rate=0.8; utt.pitch=1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

function renderStats(app){
  const vocab=projects.flatMap(p=>p.vocab||[]);
  const gelernt=vocab.filter(v=>v.status==='gelernt').length;
  const lernend=vocab.filter(v=>v.status==='lernend').length;
  const neu=vocab.filter(v=>v.status==='neu').length;
  const total=vocab.length;
  const due=vocab.filter(isDue).length;

  // Build heatmap data — last 12 weeks (84 days)
  const today=new Date(); today.setHours(0,0,0,0);
  const history=JSON.parse(localStorage.getItem('reviewHistory')||'{}');
  const heatDays=[];
  for(let i=83;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    heatDays.push({date:key,count:history[key]||0});
  }
  const maxCount=Math.max(1,...heatDays.map(d=>d.count));

  function heatColor(c){
    if(c===0) return 'var(--bg3)';
    const pct=c/maxCount;
    if(pct<0.25) return '#854d0e';
    if(pct<0.5) return '#a16207';
    if(pct<0.75) return '#ca8a04';
    return '#c9a227';
  }

  // Future due — next 30 days
  const futureDue=[];
  for(let i=1;i<=30;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const ts=d.getTime();
    const count=vocab.filter(v=>v.nextReview&&v.nextReview<=ts+86400000&&v.nextReview>ts-86400000).length;
    futureDue.push(count);
  }
  const maxFuture=Math.max(1,...futureDue);

  // Card count bar
  const totalW=total||1;
  const gPct=Math.round(gelernt/totalW*100);
  const lPct=Math.round(lernend/totalW*100);
  const nPct=100-gPct-lPct;

  // Build themen HTML outside template literal to avoid nested backtick issues
  const themenHTML=projects.map(p=>{
    const g=p.vocab.filter(v=>v.status==='gelernt').length;
    const t=p.vocab.length;
    const pct=t?Math.round(g/t*100):0;
    return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;color:var(--text)">'+p.name+'</span><span style="font-size:12px;color:var(--gold);font-weight:700">'+g+'/'+t+' · '+pct+'%</span></div><div style="background:var(--bg3);border-radius:4px;height:6px"><div style="width:'+pct+'%;background:linear-gradient(90deg,var(--gold),var(--gold2));height:6px;border-radius:4px"></div></div></div>';
  }).join('');
  const heatHTML=Array.from({length:12},(_,week)=>{
    const cells=heatDays.slice(week*7,week*7+7).map(d=>'<div title="'+d.date+': '+d.count+' Reviews" style="width:100%;height:12px;border-radius:2px;background:'+heatColor(d.count)+'"></div>').join('');
    return '<div style="display:flex;flex-direction:column;gap:3px;flex:1">'+cells+'</div>';
  }).join('');
  const legendHTML=['var(--bg3)','#854d0e','#a16207','#ca8a04','#c9a227'].map(c=>'<div style="width:10px;height:10px;border-radius:2px;background:'+c+'"></div>').join('');
  const futureDueHTML=futureDue.map((v,i)=>'<div style="flex:1;background:'+(i===0?'var(--gold)':'#1e3a5f')+';border-radius:2px 2px 0 0;height:'+Math.round(v/maxFuture*100)+'%;min-height:'+(v>0?2:0)+'px" title="Tag '+(i+1)+': '+v+'"></div>').join('');
  const cardCountHTML=[['Gelernt',gelernt,'#a3e635'],['Lernend',lernend,'#60a5fa'],['Neu',neu,'var(--text3)'],['Gesamt',total,'var(--gold)']].map(([l,v,c])=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:8px"><div style="width:8px;height:8px;border-radius:2px;background:'+c+'"></div><span style="font-size:13px;color:var(--text2)">'+l+'</span></div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:13px;font-weight:700;color:'+c+'">'+v+'</span><span style="font-size:11px;color:var(--text3);width:36px;text-align:right">'+(total?Math.round(v/total*100):0)+'%</span></div></div>').join('');

  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
      <button onclick="subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div style="font-size:20px;font-weight:800;color:var(--text)">Statistiken</div>
    </div>

    <!-- Streak & XP -->
    <div style="background:linear-gradient(135deg,#1a1a0a,#2a1f00);border:1px solid #92400e;border-radius:18px;padding:18px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:1px;margin-bottom:12px">HEUTE</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center">
        <div><div style="font-size:26px;font-weight:900;color:var(--gold)">${streak.days}</div><div style="font-size:9px;color:#78716c;margin-top:2px">Streak</div></div>
        <div><div style="font-size:26px;font-weight:900;color:var(--gold)">${streak.longest}</div><div style="font-size:9px;color:#78716c;margin-top:2px">Rekord</div></div>
        <div><div style="font-size:26px;font-weight:900;color:#60a5fa">${due}</div><div style="font-size:9px;color:#78716c;margin-top:2px">Fällig</div></div>
        <div><div style="font-size:26px;font-weight:900;color:#a3e635">${streak.totalXP||0}</div><div style="font-size:9px;color:#78716c;margin-top:2px">XP</div></div>
      </div>
    </div>

    <!-- Card Counts -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;margin-bottom:12px">KARTEN</div>
      <div style="display:flex;height:10px;border-radius:6px;overflow:hidden;margin-bottom:14px">
        <div style="width:${gPct}%;background:#a3e635"></div>
        <div style="width:${lPct}%;background:#60a5fa"></div>
        <div style="width:${nPct}%;background:var(--bg3)"></div>
      </div>
      ${cardCountHTML}
    </div>

    <!-- Heatmap -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;margin-bottom:12px">AKTIVITÄT (12 WOCHEN)</div>
      <div style="display:flex;gap:3px">
        <div style="display:flex;flex-direction:column;justify-content:space-around;padding-bottom:2px;margin-right:2px">
          ${['Mo','Mi','Fr'].map(d=>`<div style="font-size:9px;color:var(--text3);height:12px;line-height:12px">${d}</div>`).join('')}
        </div>
        <div style="display:flex;gap:3px;flex:1">
          ${heatHTML}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:5px;margin-top:10px;justify-content:flex-end">
        <span style="font-size:10px;color:var(--text3)">Wenig</span>
        ${legendHTML}
        <span style="font-size:10px;color:var(--text3)">Viel</span>
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
        <div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--gold)">${Object.values(history).reduce((a,b)=>a+b,0)}</div><div style="font-size:10px;color:var(--text3)">Gesamt</div></div>
        <div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--gold)">${heatDays.filter(d=>d.count>0).length}</div><div style="font-size:10px;color:var(--text3)">Lerntage</div></div>
        <div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--gold)">${streak.days}</div><div style="font-size:10px;color:var(--text3)">Streak</div></div>
      </div>
    </div>

    <!-- Future Due -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;margin-bottom:12px">FÄLLIG IN DEN NÄCHSTEN 30 TAGEN</div>
      <div style="display:flex;align-items:flex-end;gap:2px;height:80px">
        ${futureDueHTML}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        <span style="font-size:10px;color:var(--text3)">Morgen</span>
        <span style="font-size:10px;color:var(--text3)">+30 Tage</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--gold)">${futureDue[0]||0}</div><div style="font-size:10px;color:var(--text3)">Morgen</div></div>
        <div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--gold)">${futureDue.slice(0,7).reduce((a,b)=>a+b,0)}</div><div style="font-size:10px;color:var(--text3)">7 Tage</div></div>
        <div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--gold)">${futureDue.reduce((a,b)=>a+b,0)}</div><div style="font-size:10px;color:var(--text3)">30 Tage</div></div>
      </div>
    </div>

    <!-- Themen Übersicht -->
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;margin-bottom:12px">THEMEN</div>
      ${themenHTML}
    </div>
  </div>`;
}

// AUTH — Login / Registrierung mit E-Mail + Passwort (Supabase)
// ═══════════════════════════════════════════════════════
function renderAuth(app){
  const nav=document.getElementById('navbar');
  if(nav){ nav.style.display='none'; nav.innerHTML=''; } // Navbar komplett leeren, damit kein versehentlicher Klick durchgeht
  tab='home'; subView=null; // Zustand zurücksetzen, damit nach Login kein alter Tab-Zustand "durchsickert"
  const isSignup=authMode==='signup';
  app.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
    <div style="font-size:32px;font-weight:900;color:var(--gold);margin-bottom:4px">مركز اللغة</div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:32px">${isSignup?'Erstelle dein Konto':'Melde dich an'}</div>
    <div style="width:100%;max-width:340px">
      ${isSignup?`<input id="authName" type="text" placeholder="Name (z.B. Abu Fulan)" style="margin-bottom:10px" autocomplete="given-name"/>`:''}
      <input id="authEmail" type="email" placeholder="E-Mail-Adresse" style="margin-bottom:10px" autocomplete="email"/>
      <input id="authPassword" type="password" placeholder="Passwort" style="margin-bottom:16px" autocomplete="${isSignup?'new-password':'current-password'}"/>
      ${authError?`<div style="background:#2a1010;border:1px solid #7f1d1d;border-radius:10px;padding:10px 14px;margin-bottom:14px;color:#f87171;font-size:13px">${authError}</div>`:''}
      <button class="gold-btn" onclick="window._doAuth()" style="margin-bottom:12px" ${authLoading?'disabled':''}>${authLoading?'Lädt...':(isSignup?'Konto erstellen':'Anmelden')}</button>
      <div style="text-align:center;font-size:13px;color:var(--text3)">
        ${isSignup?'Schon ein Konto?':'Noch kein Konto?'}
        <span onclick="authMode='${isSignup?'login':'signup'}';authError='';renderAuth(document.getElementById('app'))" style="color:var(--gold);font-weight:700;cursor:pointer">${isSignup?'Anmelden':'Registrieren'}</span>
      </div>
    </div>
  </div>`;
}
window._doAuth=async function(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const isSignup=authMode==='signup';
  const nameEl=document.getElementById('authName');
  const name=nameEl?nameEl.value.trim():'';
  if(!email||!password){ authError='Bitte E-Mail und Passwort eingeben.'; renderAuth(document.getElementById('app')); return; }
  if(isSignup&&!name){ authError='Bitte gib deinen Vornamen ein.'; renderAuth(document.getElementById('app')); return; }
  if(password.length<6){ authError='Passwort muss mindestens 6 Zeichen haben.'; renderAuth(document.getElementById('app')); return; }
  authLoading=true; authError=''; renderAuth(document.getElementById('app'));
  try{
    if(isSignup){
      const {data,error}=await supa.auth.signUp({email,password,options:{data:{name}}});
      if(error) throw error;
      if(data.user){
        currentUser={id:data.user.id,email:data.user.email,name};
        await cloudSyncNow(); // Ersteinrichtung: lokalen Stand hochladen
        authLoading=false; render();
      }
    } else {
      const {data,error}=await supa.auth.signInWithPassword({email,password});
      if(error) throw error;
      currentUser={id:data.user.id,email:data.user.email,name:data.user.user_metadata?.name||''};
      await cloudLoadForUser();
      authLoading=false; render();
    }
  }catch(e){
    authLoading=false;
    authError=(e.message||'Fehler bei der Anmeldung.').includes('Invalid login')?'E-Mail oder Passwort falsch.':(e.message||'Fehler bei der Anmeldung.');
    renderAuth(document.getElementById('app'));
  }
};
async function doLogout(){
  if(supa) await supa.auth.signOut();
  currentUser=null;
  render();
}
window.doLogout=doLogout;

// BOOT — Backend ist fest eingebaut, kein API-Key vom Nutzer mehr nötig
let _bootComplete = false;
let _authListenerAttached = false;

async function boot(){
  try{
    // Erst warten bis die Supabase-Bibliothek vollständig geladen ist (max. 3 Sekunden)
    const libReady = await waitForSupabaseLib(30);
    if(!libReady){
      console.warn('Supabase-Bibliothek konnte nicht geladen werden (window.supabase fehlt nach 3s).');
    }
    if(libReady && SUPABASE_URL!=='DEINE_SUPABASE_URL'){
      try{
        supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }catch(e){
        console.warn('Supabase-Client konnte nicht erstellt werden:', e);
      }
    }
    if(supa){
      try{
        const {data,error}=await supa.auth.getSession();
        if(error) console.warn('getSession Fehler:', error);
        if(data&&data.session&&data.session.user){
          currentUser={id:data.session.user.id,email:data.session.user.email,name:data.session.user.user_metadata?.name||''};
          await cloudLoadForUser();
        }
      }catch(e){
        console.warn('getSession warf einen Fehler:', e);
      }

      // Auth-Listener NACH der initialen Prüfung registrieren, damit er nicht
      // versehentlich während des Boot-Vorgangs eine widersprüchliche Anzeige auslöst.
      if(!_authListenerAttached){
        _authListenerAttached = true;
        supa.auth.onAuthStateChange((event, session)=>{
          if(!_bootComplete) return; // Ignoriere Events während des initialen Boots
          if(event==='SIGNED_OUT'){
            currentUser=null;
            renderAuth(document.getElementById('app'));
          }
          // SIGNED_IN wird bereits explizit in window._doAuth() behandelt — hier keine Doppel-Aktion nötig
        });
      }
    }
    _bootComplete = true;
    if(supa&&!currentUser){
      renderAuth(document.getElementById('app'));
    } else {
      if(!supa) console.warn('supa ist null — Login wird komplett übersprungen. libReady war:', libReady);
      render();
    }
  } catch(e) {
    document.getElementById('app').innerHTML = '<div style="color:red;padding:20px;font-size:14px">Boot-Fehler: ' + e.message + '</div>';
  }
}
boot();
</script>
