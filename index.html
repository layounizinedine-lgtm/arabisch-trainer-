:root{--bg:#080c14;--bg2:#0d1526;--bg3:#1a2540;--border:#1e2d4a;--text:#f8fafc;--text2:#94a3b8;--text3:#64748b;--gold:#F59E0B;--gold2:#d97706}
[data-theme="light"]{--bg:#ffffff;--bg2:#f9f9f9;--bg3:#f0f0f0;--border:#e0e0e0;--text:#111111;--text2:#222222;--text3:#444444;--gold:#c9a227;--gold2:#a3811f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;width:100%;margin:0 auto;min-height:100vh;transition:background 0.3s,color 0.3s;font-size:14px}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right}
/* ── DESIGN SYSTEM ──
   Karten: 16px Padding, 16px Radius
   Buttons: .gold-btn (Primary) & .sec-btn (Secondary), 14px Radius
   Typografie: 14px Standard, 12px Sekundär, 11px Labels */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.gold-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;color:#080c14;font-weight:800;font-size:14px;padding:14px 0;width:100%;cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
.gold-btn:active{opacity:0.85}
.sec-btn{background:var(--bg3);border:1px solid var(--border);border-radius:14px;color:var(--text);font-weight:700;font-size:14px;padding:14px 0;width:100%;cursor:pointer;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
.sec-btn:active{opacity:0.85}
.label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.txt{font-size:14px;color:var(--text)}
.txt2{font-size:12px;color:var(--text3)}
input,textarea,select{background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px 14px;font-size:14px;width:100%;box-sizing:border-box;font-family:'Inter',sans-serif;outline:none}
#app{padding-bottom:90px;min-height:100vh}
#topbar{height:3px;background:linear-gradient(90deg,#F59E0B,#d97706,#92400e,#F59E0B);position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;width:100%;z-index:99}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:10px 0 20px;z-index:50;backdrop-filter:blur(10px)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-radius:24px 24px 0 0;width:100%;padding:24px;max-height:90vh;overflow-y:auto}
.quick-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform 0.1s,border-color 0.2s;-webkit-tap-highlight-color:transparent}
.quick-card:active{transform:scale(0.97)}
</style>

// Wartet bis das Supabase-CDN-Skript vollständig geladen ist (kann beim ersten App-Start etwas dauern)
function waitForSupabaseLib(maxTries){
  return new Promise((resolve)=>{
    let tries=0;
    const check=()=>{
      if(window.supabase){ resolve(true); return; }
      tries++;
      if(tries>=maxTries){ resolve(false); return; }
      setTimeout(check, 100);
    };
    check();
  });
}

const NAME_DICT={

  'sami':'سامي','adam':'آدم','yahya':'يحيى','musa':'موسى','moussa':'موسى','isa':'عيسى','dawud':'داود','dawood':'داود',
  'sulaiman':'سليمان','suleiman':'سليمان','younes':'يونس','yunus':'يونس','idris':'إدريس','zakariya':'زكريا',
  'abu fulan':'أبو فلان','fulan':'فلان',
  'fatima':'فاطمة','fatimah':'فاطمة','aisha':'عائشة','ayesha':'عائشة','khadija':'خديجة','khadijah':'خديجة',
  'zainab':'زينب','zaynab':'زينب','maryam':'مريم','mariam':'مريم','mary':'مريم','safiyyah':'صفية','safiya':'صفية',
  'sara':'سارة','sarah':'سارة','layla':'ليلى','laila':'ليلى','nour':'نور','noor':'نور','amina':'أمينة','aminah':'أمينة',
  'yusra':'يسرى','hafsa':'حفصة','hafsah':'حفصة','ruqayya':'رقية','umm kulthum':'أم كلثوم',
  'asma':'أسماء','asmaa':'أسماء','rania':'رانيا','dina':'دينا','lina':'لينا','yara':'يارا','huda':'هدى'
};
function phoneticTransliterate(word){
  const multi=[
    [/sch/gi,'ش'],[/kh/gi,'خ'],[/gh/gi,'غ'],[/sh/gi,'ش'],[/th/gi,'ث'],[/dh/gi,'ذ'],
    [/ph/gi,'ف'],[/ck/gi,'ك'],[/qu/gi,'ق'],[/ou/gi,'و'],[/ee/gi,'ي'],[/oo/gi,'و'],
    [/ei/gi,'ي'],[/ay/gi,'اي'],[/aa/gi,'ا']
  ];
  let s=word;
  multi.forEach(([re,ar])=>{ s=s.replace(re,ar); });
  const single={a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  let out='';
  for(const ch of s){
    if(/[\u0600-\u06FF]/.test(ch)){ out+=ch; continue; }
    out+=single[ch.toLowerCase()]||'';
  }
  return out;
}
function transliterateNameToArabic(name){
  if(!name) return '';
  if(/[\u0600-\u06FF]/.test(name)) return name; // schon Arabisch -> unverändert
  const fullKey=name.trim().toLowerCase();
  if(NAME_DICT[fullKey]) return NAME_DICT[fullKey];
  const words=name.trim().split(/\s+/);
  return words.map(w=>NAME_DICT[w.toLowerCase()]||phoneticTransliterate(w)).join(' ');
}
function getExTr(item){ return item.exampleTranslation?(item.exampleTranslation[lang]||item.exampleTranslation.de||''):''; }

// CLOUD SYNC — speichert Lernfortschritt bei Supabase, sobald eingeloggt
// ═══════════════════════════════════════════════════════
let _cloudSyncTimer=null;
function cloudSyncDebounced(){
  if(!supa||!currentUser) return;
  clearTimeout(_cloudSyncTimer);
  _cloudSyncTimer=setTimeout(cloudSyncNow, 1500);
}
async function cloudSyncNow(){
  if(!supa||!currentUser) return;
  try{
    await supa.from('progress').upsert({
      user_id: currentUser.id,
      projects: projects,
      streak: streak,
      settings: { cardDirection, sentenceLayout, lang, theme, qawaid: (typeof meineQawaid!=='undefined'?meineQawaid:[]) },
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  }catch(e){ console.warn('Cloud-Sync fehlgeschlagen:', e); }
}
async function cloudLoadForUser(){
  if(!supa||!currentUser) return false;
  try{
    const { data, error } = await supa.from('progress').select('*').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(data){
      if(data.projects&&data.projects.length) projects=data.projects;
      if(data.streak) streak=data.streak;
      if(data.settings){
        cardDirection=data.settings.cardDirection||cardDirection;
        theme=data.settings.theme||theme;
        document.documentElement.setAttribute('data-theme', theme);
        if(Array.isArray(data.settings.qawaid)&&data.settings.qawaid.length&&typeof meineQawaid!=='undefined'){

// SRS
// ═══════════════════════════════════════════════════════
function isDue(c){ return !c.nextReview||Date.now()>=c.nextReview; }
// "Gelernt" zählt nur, solange die Wiederholungsfrist läuft. Verpasst man sie,
// fällt das Wort aus der Prozentzahl — so sinkt der Fortschritt, bis man wiederholt.
function istGelernt(c){ return c.status==='gelernt' && !isDue(c); }
// Anki-Style SRS: "Gar nicht" und "Geht so" nutzen kurze Minuten-Intervalle (Learning Steps),
// "Gut" und "Perfekt" nutzen Tage-Intervalle wie gewohnt.
// score: 0=Gar nicht, 1=Geht so, 3=Gut, 5=Perfekt
function calcNext(card,score){
  let {interval=1,easeFactor=2.5,repetitions=0,failCount=0}=card, fc=failCount;
  const MIN=60000; // 1 Minute in ms

  if(score===0){
    // Gar nicht: Karte fällt zurück in die Lernphase, kommt in 3 Minuten wieder
    repetitions=0; fc=Math.min(failCount+1,5); interval=1;
    easeFactor=Math.max(1.3,easeFactor-0.2);
    return{...card,interval,easeFactor,repetitions,nextReview:Date.now()+3*MIN,status:'neu',lastScore:score,failCount:fc};
  }
  if(score===1){
    // Geht so: kommt in 10 Minuten wieder, bleibt in der Lernphase
    repetitions=0; fc=Math.min(failCount+1,5); interval=1;
    easeFactor=Math.max(1.3,easeFactor-0.1);
    return{...card,interval,easeFactor,repetitions,nextReview:Date.now()+10*MIN,status:'neu',lastScore:score,failCount:fc};
  }
  // score===3 (Gut) oder score===5 (Perfekt): normales Tage-Intervall
  fc=Math.max(0,failCount-1);
  interval=repetitions===0?(score>=5?3:1):repetitions===1?(score>=5?3:2):Math.round(interval*easeFactor*(score>=5?1.15:0.9));
  repetitions++;
  easeFactor=Math.max(1.3,easeFactor+0.1-(5-score)*(0.08+(5-score)*0.02));
  const pf=fc>0?Math.max(0.3,1-fc*0.15):1;
  const ai=Math.max(1,Math.round(interval*pf));
  return{...card,interval:ai,easeFactor,repetitions,nextReview:Date.now()+ai*86400000,status:score>=5?'gelernt':'lernend',lastScore:score,failCount:fc};
}
function buildPool(vocab,f){
  const base=vocab.filter(v=>f==='fällig'?isDue(v):f==='alle'?true:v.status===f);
  const pool=[];
  for(const c of base){const fc=c.failCount||0,t=fc>=4?4:fc>=3?3:fc>=2?2:1;for(let i=0;i<t;i++)pool.push(c);}
  return pool.sort(()=>Math.random()-0.5);
}

// URL deiner Vercel Backend-Funktion. Nach dem Deployment hier eintragen, z.B.:
// 'https://dein-projekt.vercel.app/api/chat'
const BACKEND_URL = 'https://arabisch-backend-three.vercel.app/api/chat';

async function callAI(prompt,maxTokens=1500,images=null){
  // Wenn ein Backend konfiguriert ist, läuft alles sicher darüber (kein API-Key im Browser)
  if(BACKEND_URL){
    const body={prompt,maxTokens};
    if(images&&images.length) body.images=images;
    const r=await fetch(BACKEND_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    if(d.text) return d.text;
    throw new Error('Unerwartete Backend-Antwort: '+JSON.stringify(d).slice(0,200));
  }
  // Fallback: direkter Aufruf mit im Browser gespeichertem Key (unsicher, nur für Entwicklung/Tests)
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':window._ak||'','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})
  });
  const d=await r.json();
  if(d.error) throw new Error(d.error.message||JSON.stringify(d.error));
  if(d.content&&d.content[0]&&d.content[0].text) return d.content[0].text;
  throw new Error('Unerwartete API-Antwort: '+JSON.stringify(d).slice(0,200));
}
function pJ(text){
  const c=text.replace(/```json|```/g,'').trim();
  // Determine intended type by first non-whitespace character
  const firstChar=c.trim()[0];
  const tryParse=(s,e)=>{
    const start=c.indexOf(s), end=c.lastIndexOf(e);
    if(start===-1||end===-1||end<=start) return null;
    try{ return JSON.parse(c.slice(start,end+1)); }catch(e){ return null; }
  };
  if(firstChar==='['){
    return tryParse('[',']') || tryParse('{','}');
  }
  return tryParse('{','}') || tryParse('[',']');
}

            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:${isActive?'var(--gold)':'var(--text3)'};transform:rotate(${isExpanded?'45deg':'0deg'});transition:transform 0.2s">${icon('plus',16,isActive?'var(--gold)':'var(--text3)',2.5)}</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:${isActive?'var(--gold)':'var(--text)'}">${p.name}</div>
                <div style="font-size:11px;color:var(--text3);margin-top:2px">Gesamt: ${t+verbList.length} Wörter</div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:800;color:${isActive?'var(--gold)':'var(--text2)'}">${pct}%</div>
              <div style="width:60px;background:var(--bg3);border-radius:4px;height:4px;margin-top:4px">
                <div style="width:${pct}%;background:${isActive?'var(--gold)':'#60a5fa'};height:4px;border-radius:4px"></div>
              </div>
            </div>
          </div>
          ${isExpanded?`<div style="padding:0 16px 14px 48px;display:flex;flex-direction:column;gap:6px">
            <div onclick="event.stopPropagation();startAllKarten(${i})" style="background:linear-gradient(135deg,#1a2f1a,#0d1a0d);border:1px solid #22c55e;border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
              <div style="display:flex;align-items:center;gap:8px">${icon('sparkles',16,'#4ade80',2)}<span style="font-size:13px;color:#4ade80;font-weight:700">Alle Wörter lernen</span></div>
              <span style="font-size:11px;color:${totalDue>0?'#4ade80':'var(--text3)'}">${totalDue>0?totalDue+' fällig':'—'}</span>
            </div>
            ${p.showVocab!==false?`<div style="display:flex;gap:6px">
              <div onclick="event.stopPropagation();curProject=${i};saveProjects();lIsVerbMode=false;window._chapterFilter=null;window._mixedMode=false;tab='lernen';subView='karten';lFilter='fällig';render()" style="flex:1;background:var(--bg3);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
                <div style="display:flex;align-items:center;gap:8px">${icon('book',16,'var(--text2)',2)}<span style="font-size:13px;color:var(--text)">Vokabeln</span></div>
                <span style="font-size:11px;color:${dueCount>0?'#ef4444':'var(--text3)'}">${dueCount>0?dueCount+' fällig':'—'}</span>
              </div>
              <div onclick="event.stopPropagation();removeDefaultCategory(${i},'vocab')" style="background:#3b1a1a;border-radius:10px;padding:0 10px;display:flex;align-items:center;cursor:pointer;color:#fca5a5;font-size:12px">✕</div>
            </div>`:`<div onclick="event.stopPropagation();setShowDefaultCategory(${i},'vocab',true)" style="background:none;border:1.5px dashed var(--border);border-radius:12px;padding:9px 14px;cursor:pointer;text-align:center;color:var(--text3);font-size:12px;font-weight:600">+ Vokabeln-Kategorie</div>`}
            ${p.showVerbs!==false?`<div style="display:flex;gap:6px">
              <div onclick="event.stopPropagation();curProject=${i};saveProjects();startVerbKarten()" style="flex:1;background:var(--bg3);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
                <div style="display:flex;align-items:center;gap:8px">${icon('bookOpen',16,'var(--text2)',2)}<span style="font-size:13px;color:var(--text)">Verben</span></div>
                <span style="font-size:11px;color:${verbDue>0?'#ef4444':'var(--text3)'}">${verbList.length===0?'keine':verbDue>0?verbDue+' fällig':'—'}</span>
              </div>
              <div onclick="event.stopPropagation();removeDefaultCategory(${i},'verbs')" style="background:#3b1a1a;border-radius:10px;padding:0 10px;display:flex;align-items:center;cursor:pointer;color:#fca5a5;font-size:12px">✕</div>
            </div>`:`<div onclick="event.stopPropagation();setShowDefaultCategory(${i},'verbs',true)" style="background:none;border:1.5px dashed var(--border);border-radius:12px;padding:9px 14px;cursor:pointer;text-align:center;color:var(--text3);font-size:12px;font-weight:600">+ Verben-Kategorie</div>`}
            ${topChapters.map(c=>{
              const subChapters=allChapters.filter(s=>s.parentId===c.id);
              const idsIncl=[c.id,...subChapters.map(s=>s.id)];
              const cVocab=p.vocab.filter(v=>idsIncl.includes(v.chapterId));
              const cDue=cVocab.filter(isDue).length;
              const chapExpanded=window._expandedChapter===c.id;
              return `<div style="display:flex;flex-direction:column;gap:6px">
                <div style="display:flex;gap:6px">
                  <div onclick="event.stopPropagation();window._expandedChapter=window._expandedChapter===${c.id}?null:${c.id};render()" style="width:32px;background:var(--bg3);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:12px;transform:rotate(${chapExpanded?'90deg':'0deg'});transition:transform 0.2s">›</div>
                  <div onclick="event.stopPropagation();startChapterKarten(${i},${c.id})" style="flex:1;background:var(--bg3);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
                    <div style="display:flex;align-items:center;gap:8px">${icon('tag',16,'#a78bfa',2)}<span style="font-size:13px;color:var(--text)">${c.name}: ${cVocab.length} Wörter</span></div>
                    <span style="font-size:11px;color:${cDue>0?'#ef4444':'var(--text3)'}">${cVocab.length===0?'leer':cDue>0?cDue+' fällig':'—'}</span>
                  </div>
                  <div onclick="event.stopPropagation();addChapter(${i},${c.id})" style="background:var(--bg3);border-radius:10px;width:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#a78bfa">${icon('plus',14,'#a78bfa',2.5)}</div>
                  <div onclick="event.stopPropagation();deleteChapter(${i},${c.id})" style="background:#3b1a1a;border-radius:10px;padding:0 10px;display:flex;align-items:center;cursor:pointer;color:#fca5a5;font-size:12px">✕</div>
                </div>
                ${chapExpanded?`<div style="padding-left:38px;display:flex;flex-direction:column;gap:6px">
                  ${subChapters.map(s=>{
                    const sVocab=p.vocab.filter(v=>v.chapterId===s.id);
                    const sDue=sVocab.filter(isDue).length;
                    return `<div style="display:flex;gap:6px">
                      <div onclick="event.stopPropagation();startChapterKarten(${i},${s.id})" style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
                        <div style="display:flex;align-items:center;gap:8px">${icon('tag',14,'#f0abfc',2)}<span style="font-size:12px;color:var(--text)">${s.name}: ${sVocab.length} Wörter</span></div>
                        <span style="font-size:10px;color:${sDue>0?'#ef4444':'var(--text3)'}">${sVocab.length===0?'leer':sDue>0?sDue+' fällig':'—'}</span>
                      </div>
                      <div onclick="event.stopPropagation();deleteChapter(${i},${s.id})" style="background:#3b1a1a;border-radius:10px;padding:0 10px;display:flex;align-items:center;cursor:pointer;color:#fca5a5;font-size:11px">✕</div>
                    </div>`;
                  }).join('')}
                  ${subChapters.length===0?`<div style="font-size:11px;color:var(--text3);padding:4px 0 2px">Noch keine Unterkapitel</div>`:''}
                </div>`:''}
              </div>`;
            }).join('')}
            <div onclick="event.stopPropagation();addChapter(${i})" style="background:none;border:1.5px dashed var(--border);border-radius:12px;padding:9px 14px;cursor:pointer;text-align:center;color:var(--text3);font-size:12px;font-weight:600">+ Kapitel (z.B. Text 1)</div>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>

    <!-- Spruch -->
    <div style="background:linear-gradient(135deg,#0f1f3d,#1a2a5e);border:1px solid #2d4a8a;border-radius:18px;padding:18px">
      <div style="font-size:10px;color:#60a5fa;letter-spacing:2px;font-weight:700;margin-bottom:10px">${ui('quoteTitle')}</div>
      <div class="ar" style="font-size:24px;color:#f8fafc;font-weight:700;line-height:1.8;margin-bottom:8px">${motto.ar}</div>
      <div style="font-size:13px;color:#93c5fd;font-weight:600;margin-bottom:4px">${motto.de}</div>
      ${motto.hint?`<div style="font-size:11px;color:#64748b">${motto.hint}</div>`:''}
    </div>

  </div>`;
}

// ═══════════════════════════════════════════════════════
// LERNEN (enthält ${ui('vocab')}, Karten, ${ui('verbs')}, ${ui('games')}, ${ui('correction')})
// ═══════════════════════════════════════════════════════
function renderLernen(app){
  if(subView==='vokabeln') { renderVokabeln(app); return; }
  if(subView==='verben') { renderVerben(app); return; }
  if(subView==='spiele') { renderSpiele(app); return; }
  if(subView==='korrektor') { renderKorrektor(app); return; }
  if(subView==='karten') { renderKarten(app); return; }
  if(subView==='diktat') { renderDiktat(app); return; }
  if(subView==='handschreiben') { renderHandschreiben(app); return; }
  if(subView==='qawaid') { renderQawaid(app); return; }
  // Default: Lern-Übersicht
  const vocab=getVocab();
  const due=vocab.filter(isDue).length;
  const neu=vocab.filter(v=>v.status==='neu').length;
  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="padding-top:6px;margin-bottom:24px">
      <div style="font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase">Lernen</div>
      <div style="font-size:26px;font-weight:800;color:var(--text)">${ui('learnTitle')}</div>
    </div>

    <!-- Hauptlernbereich -->
    <div onclick="lIsVerbMode=false;window._chapterFilter=null;window._mixedMode=false;subView='karten';render()" style="background:linear-gradient(135deg,#1a2f1a,#0d1a0d);border:1px solid ${due>0?'#22c55e':'var(--border)'};border-radius:18px;padding:20px;margin-bottom:12px;cursor:pointer">
      <div style="margin-bottom:8px">${icon('rotate',26,due>0?'#4ade80':'var(--text)',2)}</div>
      <div style="font-size:18px;font-weight:800;color:${due>0?'#4ade80':'var(--text)'}">${ui("reviews")}</div>
      <div style="font-size:13px;color:var(--text3);margin-top:4px">${due>0?`${due} ${ui('cardsWaiting')}`:ui('allLearned')}}</div>
      ${due>0?`<div style="margin-top:12px;background:linear-gradient(135deg,#22c55e,#16a34a);border:none;border-radius:10px;padding:10px;text-align:center;color:#0a1628;font-weight:800;font-size:14px">Jetzt ${due} Karten lernen →</div>`:''}
    </div>

    <div onclick="lIsVerbMode=false;window._chapterFilter=null;window._mixedMode=false;subView='karten';render()" style="background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;display:flex;gap:14px;align-items:center">
      <div>${icon('sparkles',28,'var(--gold)',2)}</div>
      <div><div style="font-size:16px;font-weight:700;color:var(--text)">${ui('newWords')}</div><div style="font-size:12px;color:var(--text3);margin-top:2px">${neu} neue Wörter</div></div>
      <div style="color:var(--text3);font-size:20px;margin-left:auto">›</div>
    </div>

    <!-- Sub-Navigation -->
    <div style="font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:20px 0 12px">Bereiche</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${[
        {icon:'book',title:ui('vocab'),desc:ui('vocab')+' verwalten',sv:'vokabeln'},
        {icon:'bookOpen',title:ui('verbs'),desc:'Konjugationstabellen',sv:'verben'},
        {icon:'mic',title:'Diktat',desc:'Sätze hören & schreiben',sv:'diktat'},
        {icon:'pencil',title:'Handschreiben',desc:'Von Hand schreiben üben',sv:'handschreiben'},
        {icon:'pencil',title:ui('correction'),desc:'Texte prüfen',sv:'korrektor'},
        {icon:'bookOpen',title:'Qawāʿid',desc:'Grammatik-Regeln nachschlagen',sv:'qawaid'},
      ].map(q=>`<div class="quick-card" onclick="subView='${q.sv}';${q.sv==='diktat'?'window._diktatState=null;':''}${q.sv==='handschreiben'?'window._hsState=null;':''}render()">
        <div>${icon(q.icon,24,'var(--gold)',2)}</div>
        <div style="font-size:14px;font-weight:700;color:var(--text)">${q.title}</div>
        <div style="font-size:11px;color:var(--text3)">${q.desc}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ── VOKABELN ─────────────────────────────────────────────────────────────────
function renderVokabeln(app){
  const vocab=getVocab();
  const due=vocab.filter(isDue).length;
  const chapters=getChapters();
  const activeChapter=window._vokFilterChapter!==undefined?window._vokFilterChapter:'all';
  const shown=activeChapter==='all'?vocab:vocab.filter(v=>(v.chapterId||null)===activeChapter);
  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
      <button onclick="subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div><div style="font-size:11px;color:var(--text3)">LERNEN</div><div style="font-size:20px;font-weight:800;color:var(--text)">${ui('vocab')}</div></div>
      <button onclick="showAddVocab()" class="gold-btn" style="width:auto;padding:8px 16px;margin-left:auto;font-size:13px">+ Hinzufügen</button>
    </div>
    ${due>0?`<div onclick="lIsVerbMode=false;window._chapterFilter=null;window._mixedMode=false;subView='karten';render()" style="background:linear-gradient(135deg,#1a2f1a,#0d1a0d);border:1px solid #22c55e;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer"><div><div style="font-size:13px;font-weight:700;color:#4ade80">${due} ${ui('reviews')} fällig</div><div style="font-size:11px;color:var(--text3)">Tippe um zu lernen</div></div><div style="font-size:24px;font-weight:800;color:#4ade80">${due}</div></div>`:''}
    <div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px">
      ${chapters.length?`<button onclick="window._vokFilterChapter='all';renderVokabeln(document.getElementById('app'))" style="background:${activeChapter==='all'?'var(--gold)':'var(--bg3)'};border:1px solid ${activeChapter==='all'?'var(--gold)':'var(--border)'};color:${activeChapter==='all'?'#080c14':'var(--text2)'};border-radius:10px;padding:6px 12px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0">Alle</button>`:''}
      ${chapters.map(c=>`<button onclick="window._vokFilterChapter=${c.id};renderVokabeln(document.getElementById('app'))" style="background:${activeChapter===c.id?'var(--gold)':'var(--bg3)'};border:1px solid ${activeChapter===c.id?'var(--gold)':'var(--border)'};color:${activeChapter===c.id?'#080c14':'var(--text2)'};border-radius:10px;padding:6px 12px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0">${c.parentId?'↳ ':''}${c.name}</button>`).join('')}
      <button onclick="addChapter(curProject);window._vokFilterChapter='all'" style="background:none;border:1.5px dashed var(--border);color:var(--text3);border-radius:10px;padding:6px 12px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0">+ Kapitel</button>
    </div>
    ${(()=>{
      const total=shown.length;
      const neu=shown.filter(v=>v.status==='neu').length;
      const lernend=shown.filter(v=>v.status==='lernend'||(v.status==='gelernt'&&isDue(v))).length;
      const gelernt=shown.filter(istGelernt).length;
      const pctL=total?Math.round(lernend/total*100):0;
      const pctG=total?Math.round(gelernt/total*100):0;
      const label=activeChapter==='all'?'Karten im Deck':(chapters.find(c=>c.id===activeChapter)||{}).name||'Karten im Deck';
      return `<div class="card">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${label} (${total})</div>
        <div style="display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--bg3);margin-bottom:10px">
          <div style="width:${pctL}%;background:#60a5fa"></div>
          <div style="width:${pctG}%;background:#a3e635"></div>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px">
          <div style="display:flex;align-items:center;gap:5px;color:var(--text3)"><div style="width:8px;height:8px;border-radius:2px;background:var(--text3)"></div>${neu} Nicht gelernte</div>
          <div style="display:flex;align-items:center;gap:5px;color:var(--text3)"><div style="width:8px;height:8px;border-radius:2px;background:#60a5fa"></div>${lernend} In Bearbeitung</div>
          <div style="display:flex;align-items:center;gap:5px;color:var(--text3)"><div style="width:8px;height:8px;border-radius:2px;background:#a3e635"></div>${gelernt} Gemeisterte</div>
        </div>
      </div>`;
    })()}
    <input placeholder="🔍 Suchen..." oninput="filterVocab(this.value)" style="margin-bottom:14px"/>
    <div id="vocabList">${shown.map(v=>vocabCard(v)).join('')}</div>
  </div>`;
}

function vocabCard(v){
  const tr=getTr(v), exTr=getExTr(v);
  const sc=v.status==='gelernt'?'#4ade80':v.status==='lernend'?'#60a5fa':'var(--text3)';
  const sb=v.status==='gelernt'?'#14532d':v.status==='lernend'?'#1e3a5f':'var(--bg3)';
  const isAdj=(v.wordType||'').toLowerCase().includes('adj');
  const chapters=getChapters();
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div style="flex:1">
        <div style="font-size:11px;color:var(--text3)">${v.wordType||''}</div>
        <div style="font-size:16px;font-weight:700;color:var(--text);margin-top:2px">${tr}</div>
        <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;align-items:flex-end">
          <div><div style="font-size:10px;color:var(--text3);margin-bottom:2px">مفرد</div><div style="display:flex;align-items:center;gap:8px"><div class="ar" style="font-size:28px;color:var(--gold);font-weight:700">${v.harakat||v.arabic}</div><button onclick="speakAr('${(v.harakat||v.arabic).replace(/'/g,"\\'")}');event.stopPropagation()" style="background:var(--bg3);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">${icon('volume',15,'var(--gold)',2)}</button></div></div>
          ${v.plural&&v.plural!=='-'?`<div><div style="font-size:10px;color:var(--text3);margin-bottom:2px">جمع</div><div class="ar" style="font-size:28px;color:#a78bfa;font-weight:700">${v.pluralHarakat||v.plural}</div></div>`:''}
          ${isAdj&&v.opposite&&v.opposite!==''?`<div><div style="font-size:10px;color:var(--text3);margin-bottom:2px">العكس</div><div class="ar" style="font-size:28px;color:#60a5fa;font-weight:700">${v.oppHarakat||v.opposite}</div></div>`:''}
        </div>
        ${v.exampleArabic?`<div style="margin-top:10px;padding:10px;background:var(--bg3);border-radius:10px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div class="ar" style="font-size:16px;color:var(--text);line-height:1.9;flex:1">${v.exampleArabic}</div><button onclick="speakAr('${(v.exampleArabic||'').replace(/'/g,"\\'")}');event.stopPropagation()" style="background:var(--bg2);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">${icon('volume',13,'var(--text2)',2)}</button></div><div style="font-size:11px;color:var(--text3);margin-top:3px">${exTr}</div></div>`:''}
        ${chapters.length?`<select onchange="assignVocabChapter(${v.id},this.value)" style="margin-top:10px;font-size:12px;padding:8px 10px"><option value="" ${!v.chapterId?'selected':''}>Kein Kapitel</option>${chapters.map(c=>`<option value="${c.id}" ${v.chapterId===c.id?'selected':''}>${c.parentId?'↳ ':''}${c.name}</option>`).join('')}</select>`:''}
        <button onclick="showVocabMehr(${v.id})" style="margin-top:10px;background:none;border:1px solid #3b2d6e;border-radius:10px;padding:8px 14px;color:#a78bfa;font-size:12px;font-weight:700;cursor:pointer;width:100%">Kontext & Mehr anzeigen</button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0">

function globaleSuche(q){
  const box=document.getElementById('globalSearchResults');
  if(!box) return;
  q=(q||'').trim();
  if(q.length<2){ box.innerHTML=''; return; }
  const qAr=stripH(q), qDe=q.toLowerCase();
  const istArabisch=/[؀-ۿ]/.test(q);
  const treffer=[];
  projects.forEach((p,pi)=>{
    const chapters=p.chapters||[];
    const passt=(item)=>{
      if(istArabisch){
        return stripH(item.arabic||'').includes(qAr)
          || stripH(item.harakat||'').includes(qAr)
          || stripH(item.plural||'').includes(qAr);
      }
      return getTr(item).toLowerCase().includes(qDe);
    };
    (p.vocab||[]).forEach(v=>{
      if(passt(v)){

function handleVocabFileUpload(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const isExcel=/\.(xlsx|xls)$/i.test(file.name);
  const reader=new FileReader();
  reader.onload=(e)=>{
    let words=[];
    if(isExcel){
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array'});
        wb.SheetNames.forEach(sheetName=>{
          const sheet=wb.Sheets[sheetName];
          const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
          rows.forEach(row=>row.forEach(cell=>{
            const s=String(cell||'').trim();
            if(s&&/[\u0600-\u06FF]/.test(s)) words.push(s);
          }));
        });
      }catch(err){ alert('Fehler beim Lesen der Excel-Datei: '+err.message); return; }
    } else {
      const text=e.target.result;
      words=text.split(/[\n,;]+/).map(w=>w.trim()).filter(w=>w&&/[\u0600-\u06FF]/.test(w));
    }
    words=[...new Set(words)];
    const ta=document.getElementById('arIn');
    if(ta) ta.value=words.join('\n');
    if(!words.length) alert('Keine arabischen Wörter in der Datei gefunden.');
  };
  if(isExcel) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
  event.target.value='';
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handleVocabImageUpload(event){
  const files=Array.from(event.target.files||[]);
  if(!files.length)return;
  const statusEl=document.getElementById('imageUploadStatus');
  if(statusEl) statusEl.textContent=`Analysiere ${files.length} Bild${files.length>1?'er':''}...`;
  try{
    const images=await Promise.all(files.map(async f=>({media_type:f.type||'image/jpeg',data:await fileToBase64(f)})));
    const raw=await callAI(`Look at the image(s). Find every Arabic word visible (in vocabulary lists, textbook pages, handwriting, signs, etc). If a German translation is shown next to a word, include it. Reply ONLY with a JSON array: [{"arabic":"word as seen","german":"translation if visible, else empty string"}]. If no Arabic text is found, reply with [].`,2000,images);
    const arr=pJ(raw);
    if(Array.isArray(arr)&&arr.length){
      const ta=document.getElementById('arIn');
      const trIn=document.getElementById('trIn');
      if(ta) ta.value=arr.map(x=>x.arabic).filter(Boolean).join('\n');
      const germanHints=arr.map(x=>x.german).filter(Boolean);
      if(trIn&&germanHints.length) trIn.value=germanHints.join(', ');
      if(statusEl) statusEl.textContent=`${arr.length} Wort${arr.length>1?'er':''} erkannt – bitte prüfen, dann "Karten erstellen"`;
    } else {
      if(statusEl) statusEl.textContent='Keine arabischen Wörter im Bild erkannt.';
    }
  }catch(e){
    if(statusEl) statusEl.textContent='Fehler: '+e.message;
  }
  event.target.value='';
}

{"arabic":"exact word as given","harakat":"word with FULL diacritics including tanwin e.g. كِتَابٌ","translations":{"de":"German"},"wordType":"Nomen/Verb/Adjektiv/etc","opposite":"Arabic opposite WITH diacritics only if Adjektiv else empty string","oppHarakat":"opposite with diacritics or empty","plural":"Arabic plural WITH diacritics or -","pluralHarakat":"plural with diacritics or -","exampleArabic":"example sentence with FULL diacritics","exampleTranslation":{"de":"German"}}`,1200+400*toGenerate.length);

    addXP(newEntries.length*5);

    if(words.length>1) alert(`${newEntries.length} Wörter hinzugefügt (${newEntries.length-generatedCount} bereits bekannt & sofort übernommen, ${generatedCount} neu von der KI erstellt).`);
    renderVokabeln(document.getElementById('app'));
  } else {
    btn.textContent='Karte erstellen'; btn.disabled=false;
  }
}

let lP=[],lI=0,lF=false,lS={p:0,g:0,s:0},lD=false,lFilter='fällig',lIsVerbMode=false;

// Wandelt ein Verb in eine "virtuelle Vokabelkarte" um: هُوَ-Form vorne, Übersetzung + Beispielsatz hinten
function verbToCard(v){
  const praesensHuwa=(v.konjugation&&v.konjugation.gegenwart&&v.konjugation.gegenwart[0])?v.konjugation.gegenwart[0].a:v.arabic;
  const beispiel=(v.beispiele&&v.beispiele[0])?v.beispiele[0]:null;
  return {
    id:v.id, arabic:praesensHuwa, harakat:praesensHuwa,
    translations:v.translations, wordType:'Verb',
    exampleArabic:beispiel?beispiel.a:'', exampleTranslation:beispiel?{de:beispiel.d,en:beispiel.d}:null,
    plural:'', pluralHarakat:'', opposite:'', oppHarakat:'',
    status:v.status||'neu', interval:v.interval||1, easeFactor:v.easeFactor||2.5,
    repetitions:v.repetitions||0, failCount:v.failCount||0, nextReview:v.nextReview||0,
    _isVerb:true, _origId:v.id
  };
}
function startVerbKarten(){
  lIsVerbMode=true; window._chapterFilter=null;window._mixedMode=false;
  tab='lernen'; subView='karten'; lFilter='fällig';
  render();
}

function renderKarten(app){
  let source;
  if(window._mixedMode){
    source=getVocab().concat(getVerbs().map(verbToCard));
  } else if(lIsVerbMode){
    source=getVerbs().map(verbToCard);
  } else {
    source=getVocab();
    if(window._chapterFilter!=null){ source=source.filter(v=>window._chapterFilter.includes(v.chapterId)); }
  }
  lP=buildPool(source,lFilter); lI=0; lF=false; lS={p:0,g:0,s:0}; lD=false;
  showCard(app);
}

    ${lS.s>0?`<div style="background:#1a1000;border:1px solid #92400e;border-radius:12px;padding:12px;margin-bottom:14px;font-size:12px;color:var(--gold)">${ui('badCards')||'Schlechte Karten kommen öfter wieder.'}</div>`:''}

  if(!lP.length){
    app.innerHTML=`<div style="padding:20px 16px 100px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-top:6px"><button onclick="lIsVerbMode=false;window._chapterFilter=null;window._mixedMode=false;subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button><div style="font-size:20px;font-weight:800;color:var(--text)">Lernkarten</div></div>

  }
  const card=lP[lI];
  const tr=getTr(card), exTr=getExTr(card);
  const isDe2Ar=cardDirection==='de2ar';
  const hasPlural=card.plural&&card.plural!=='-';
  // Mufrad/Jam'u nebeneinander — wird auf der arabischen Seite gezeigt (vorne bei ar2de, hinten bei de2ar)
  const mufradJamuBlock=hasPlural?`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <div style="background:var(--bg3);border-radius:10px;padding:10px 14px;text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:4px">مفرد</div><div class="ar" style="font-size:22px;color:var(--gold)">${card.harakat||card.arabic}</div></div>
      <div style="background:var(--bg3);border-radius:10px;padding:10px 14px;text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:4px">جمع</div><div class="ar" style="font-size:22px;color:#a78bfa">${card.pluralHarakat||card.plural}</div></div>
    </div>`:`<div class="ar" style="font-size:52px;color:var(--gold);font-weight:700;line-height:1.4">${card.harakat||card.arabic}</div>`;
  // Vorderseite: Arabisch (mit mufrad/jam'u falls vorhanden) ODER nur Deutsch
  const frontContent=!isDe2Ar
    ? mufradJamuBlock
    : `<div style="font-size:32px;color:var(--gold);font-weight:800;line-height:1.4">${tr}</div>`;
  const oppositeBlock=(card.wordType||'').toLowerCase().includes('adj')&&card.opposite&&card.opposite!==''?`<div style="background:var(--bg3);border-radius:10px;padding:10px 14px;text-align:center;margin-top:14px;display:inline-block"><div style="font-size:10px;color:var(--text3);margin-bottom:4px">العكس</div><div class="ar" style="font-size:20px;color:#60a5fa">${card.oppHarakat||card.opposite}</div></div>`:'';
  // Beispielsatz: gestapelt (Arabisch exakt über Deutsch, gleiche Breite/Zentrierung) oder nebeneinander mit "-"
  const sentenceBlock=card.exampleArabic?(
    sentenceLayout==='sideBySide'
      ? `<div style="background:var(--bg3);border-radius:12px;padding:14px;margin-top:14px"><div style="font-size:14px;color:var(--text);line-height:1.8"><span class="ar" style="font-size:17px">${card.exampleArabic}</span><span style="color:var(--text3)"> - </span><span style="color:var(--text3)">${exTr}</span></div></div>`
      : `<div style="background:var(--bg3);border-radius:12px;padding:14px;margin-top:14px;display:flex;flex-direction:column;align-items:center;text-align:center"><div class="ar" style="font-size:18px;color:var(--text);line-height:1.9">${card.exampleArabic}</div><div style="font-size:12px;color:var(--text3);margin-top:6px">${exTr}</div></div>`
  ):'';
  // Rückseite: NUR Deutsch + Satz (bei ar2de) — oder mufrad/jam'u + Satz (bei de2ar)
  const backContent=!isDe2Ar
    ? `<div style="width:100%;display:flex;flex-direction:column;align-items:center">
        <div style="font-size:26px;font-weight:800;color:var(--text);margin-bottom:${oppositeBlock?'0':'4px'}">${tr}</div>
        ${oppositeBlock}
        ${sentenceBlock}
      </div>`
    : `<div style="width:100%;display:flex;flex-direction:column;align-items:center">
        ${mufradJamuBlock}
        ${oppositeBlock}
        ${sentenceBlock}

  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-top:6px">
      <button onclick="lIsVerbMode=false;window._chapterFilter=null;window._mixedMode=false;subView=null;render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div style="font-size:20px;font-weight:800;color:var(--text)">${window._mixedMode?'Alle Wörter':(lIsVerbMode?'Verben':(window._chapterFilter!=null?((getChapters().find(c=>c.id===window._chapterFilter[0])||{}).name||'Lernkarten'):'Lernkarten'))}</div>
      <div style="font-size:13px;font-weight:700;color:var(--gold);margin-left:auto">${lI+1}/${lP.length}</div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px">${fb}</div>
    <div style="background:var(--bg3);border-radius:4px;height:4px;margin-bottom:16px"><div style="width:${((lI+1)/lP.length)*100}%;background:${(card.failCount||0)>1?'#ef4444':'var(--gold)'};height:4px;border-radius:4px;transition:width 0.4s"></div></div>

      ${!lF?`${(card.failCount||0)>0?`<div style="font-size:10px;color:#f97316;margin-bottom:10px;font-weight:700">SCHWIERIG – ${card.failCount}x falsch</div>`:''}

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">${RATES.map(r=>{
      const preview=calcNext(card,r.s);
      const diffMs=preview.nextReview-Date.now();
      let timeLabel;
      if(diffMs<3600000) timeLabel=Math.round(diffMs/60000)+'min';
      else if(diffMs<86400000) timeLabel=Math.round(diffMs/3600000)+'h';
      else timeLabel=Math.round(diffMs/86400000)+'d';
      return `<button onclick="rateCard(${r.s})" style="background:var(--bg2);border:1px solid ${r.c}44;border-radius:14px;padding:12px 4px;cursor:pointer;text-align:center">
        <div style="font-size:13px;font-weight:800;color:${r.c}">${r.l}</div>

    <button onclick="lF=false;lI++;if(lI>=lP.length){lD=true;}showCard(document.getElementById('app'))" style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;width:100%;color:var(--text2);font-weight:700;cursor:pointer">${ui('skip')}</button></div>`:''}`
}
function rateCard(score){
  const card=lP[lI];
  const updated=calcNext(card,score);
  if(card._isVerb){
    setVerbs(getVerbs().map(v=>v.id===card._origId?{...v,status:updated.status,interval:updated.interval,easeFactor:updated.easeFactor,repetitions:updated.repetitions,failCount:updated.failCount,nextReview:updated.nextReview,lastScore:updated.lastScore}:v));
  } else {
    setVocab(getVocab().map(v=>v.id===card.id?updated:v));
  }
  if(score>=5)lS.p++;else if(score>=3)lS.g++;else lS.s++;
  addXP(score>=5?10:score>=3?5:2);
  // Anki-Style: Karten mit kurzem Lern-Intervall (Minuten) kommen direkt wieder in der aktuellen Session dran
  if(score<3){
    lP.push(updated);
  }
  lI++; lF=false;
  if(lI>=lP.length){lD=true;updateStreak();}
  showCard(document.getElementById('app'));
}

let meineQawaid=JSON.parse(localStorage.getItem('qawaid_v1')||'[]');

function qawaidNorm(s){
  return stripH(String(s||'')).toLowerCase()
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
    .replace(/[āâ]/g,'a').replace(/[īî]/g,'i').replace(/[ūû]/g,'u')
    .replace(/[ḍḏ]/g,'d').replace(/[ṭṯ]/g,'t').replace(/[ṣš]/g,'s').replace(/ḥ/g,'h').replace(/[ʿʾ'`’]/g,'')
    .replace(/[-_/.,؟?!]/g,' ').replace(/\s+/g,' ').trim();
}
// Exakter Treffer immer; Teiltreffer nur ab 4 Zeichen (sonst matcht z.B. "al" überall)
function qawaidPasst(n,q){
  if(!n||!q) return false;
  if(n===q) return true;
  if(n.length>=4&&q.includes(n)) return true;
  if(q.length>=4&&n.includes(q)) return true;
  return false;
}
function qawaidFinde(eingabe){
  const q=qawaidNorm(eingabe);
  if(!q) return null;
  return QAWAID_DB.find(r=>r.namen.some(n=>qawaidPasst(qawaidNorm(n),q)))||null;
}
function qawaidFindeGespeichert(eingabe){
  const q=qawaidNorm(eingabe);
  if(!q) return null;
  return meineQawaid.find(r=>qawaidPasst(qawaidNorm(r.name),q))||null;
}

window._qawaidLoesch=function(i){
  const r=meineQawaid[i]; if(!r) return;
  if(!confirm('Regel „'+r.name+'" wirklich löschen?')) return;
  meineQawaid.splice(i,1); saveQawaidLocal();

window._qawaidErklaeren=async function(){
  const eingabe=(document.getElementById('qawaidInput').value||'').trim();
  const box=document.getElementById('qawaidErgebnis');
  if(!eingabe||!box) return;
  // 1. Eingebaute Grundregel?
  const regel=qawaidFinde(eingabe);
  if(regel){ box.innerHTML=qawaidRegelHtml(regel); return; }
  // 2. Schon gespeichert? Dann ohne KI anzeigen.
  const gesp=qawaidFindeGespeichert(eingabe);
  if(gesp){ box.innerHTML=qawaidGespeichertHtml(gesp); return; }
  // 3. Neu: KI fragen und dauerhaft speichern.
  box.innerHTML=`<div class="card" style="margin-top:14px;text-align:center;color:var(--text3)"><div style="font-size:13px;margin-bottom:10px">Die KI erklärt „${escQ(eingabe)}"…</div><div style="font-size:24px">⏳</div></div>`;

    const text=await callAI('Du bist ein geduldiger Arabischlehrer für deutschsprachige Anfänger. Erkläre die arabische Grammatikregel "'+eingabe+'" EINFACH und ohne unnötigen Fachjargon (nötige Fachbegriffe kurz erklären). Struktur: 1) Kurze Erklärung in 2-4 Sätzen. 2) 3 einfache Beispiele, jeweils: arabisch mit Vokalzeichen, Umschrift, deutsche Übersetzung. 3) Ein einprägsamer Merksatz. Antworte auf Deutsch, als reiner Text ohne Markdown-Zeichen wie ** oder ##.',1200);
    if(!text||!text.trim()) throw new Error('leere Antwort');
    // Speichern (bei gleichem Namen: aktualisieren statt Duplikat)
    const q=qawaidNorm(eingabe);
    const idx=meineQawaid.findIndex(r=>qawaidNorm(r.name)===q);
    const eintrag={name:eingabe,text:text.trim(),datum:new Date().toISOString()};
    if(idx>=0) meineQawaid[idx]=eintrag; else meineQawaid.push(eintrag);
    saveQawaidLocal();
    const m=document.getElementById('qawaidMeine'); if(m) m.innerHTML=renderMeineQawaidHtml();
    box.innerHTML=`<div class="card" style="margin-top:14px">
      <div style="font-size:16px;font-weight:800;color:var(--gold);margin-bottom:8px">${escQ(eingabe)}</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap">${escQ(text.trim())}</div>
      <div style="font-size:10px;color:#4ade80;margin-top:12px">✓ Unter „Meine Regeln" gespeichert — ab jetzt jederzeit ohne KI abrufbar.</div>
    </div>`;
  }catch(e){
    box.innerHTML=`<div class="card" style="margin-top:14px;color:#f87171;font-size:13px">Die KI-Anfrage ist fehlgeschlagen (${escQ(e.message)}). Bist du online? Versuch es gleich nochmal.</div>`;
  }
};

    window._vt=activeTense;

    window._mehrError=null;
  }
  window._verbDetailId=id;

  function draw(){
  const vt=window._vt;
  const mehrData=window._mehrData;
  const mehrLoading=window._mehrLoading;
    const tc=TENSES.find(x=>x.key===vt)||TENSES[0];

      <div style="display:flex;gap:8px;align-items:center">

      ${TENSES.map(tn=>`<div onclick="window._vt='${tn.key}';showVerbDetail(window._verbDetailId)" style="flex-shrink:0;padding:10px 16px;border-radius:20px;cursor:pointer;background:${vt===tn.key?tn.color+'33':'var(--bg3)'};border:2px solid ${vt===tn.key?tn.color:'transparent'};-webkit-tap-highlight-color:transparent">

      </div>`).join('')}

      ${vt==='mehr'?renderMehrContent():renderTenseContent(tc,verb)}
    </div>`;
    document.body.appendChild(m);
  }

  function renderTenseContent(tc,verb){
    const vt=window._vt;
    const ORDER_N=['هُوَ','هُمَا','هُمْ','هِيَ','هُمَا','هُنَّ','أَنْتَ','أَنْتُمَا','أَنْتُمْ','أَنْتِ','أَنْتُمَا','أَنْتُنَّ','أَنَا','نَحْنُ'];
    const ORDER_B=['أَنْتَ','أَنْتُمَا','أَنْتُمْ','أَنْتِ','أَنْتُنَّ'];
    const ORDER=vt==='befehl'?ORDER_B:ORDER_N;
    const raw=(verb.konjugation&&verb.konjugation[vt])||[];
    const strip=s=>(s||'').replace(/[\u064B-\u065F\u0670]/g,'').trim();
    const usedIdx=new Set();
    const sorted=raw.map(f=>{
      let bestI=-1;
      for(let i=0;i<ORDER.length;i++){
        if(!usedIdx.has(i) && strip(ORDER[i])===strip(f.p)){ bestI=i; break; }
      }
      if(bestI===-1) bestI=999;
      usedIdx.add(bestI);
      return {f,idx:bestI};
    }).sort((a,b)=>a.idx-b.idx).map(x=>x.f);
    return `<div style="font-size:12px;font-weight:700;color:${tc.color};margin-bottom:12px">${tc.label}</div>

    ${verb.konjugation&&verb.konjugation.merksatz?`<div style="background:linear-gradient(135deg,#1a1f3a,#0d1226);border:1px solid #2d3a6e;border-radius:14px;padding:16px;margin-top:16px"><div style="font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:8px">WORTSTAMM & MERKHILFE</div><div style="font-size:13px;color:#93c5fd;line-height:1.6">${verb.konjugation.merksatz}</div></div>`:''}`;
  }

  function renderMehrContent(){
    const mehrLoading=window._mehrLoading;
    const mehrData=window._mehrData;
    const mehrError=window._mehrError;
    if(mehrLoading) return `<div style="text-align:center;padding:40px;color:var(--text3)">KI lädt Kontext-Bedeutungen...</div>`;
    if(mehrError) return `<div style="text-align:center;padding:40px">
      <div style="font-size:13px;color:#fca5a5;margin-bottom:16px">${mehrError}</div>
      <button onclick="window._mehrError=null;loadMehr()" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:12px;padding:14px 24px;color:white;font-weight:700;font-size:14px;cursor:pointer">Nochmal versuchen</button>
    </div>`;
    if(!mehrData) return `<div style="text-align:center;padding:40px">
      <div style="font-size:14px;color:var(--text3);margin-bottom:16px">Entdecke alle Bedeutungen und Kontexte von <span class="ar" style="color:var(--gold);font-size:18px">${verb.arabic}</span></div>
      <button onclick="loadMehr()" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:12px;padding:14px 24px;color:white;font-weight:700;font-size:14px;cursor:pointer">Kontext laden</button>
    </div>`;
    return `<div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:12px">BEDEUTUNGEN & KONTEXT</div>
      ${(mehrData.bedeutungen||[]).map(b=>`<div style="background:var(--bg2);border:1px solid #3b2d6e;border-radius:14px;padding:14px;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:#a78bfa;margin-bottom:6px">${b.kontext}</div>
        <div class="ar" style="font-size:20px;color:var(--gold);margin-bottom:4px">${b.arabisch}</div>
        <div style="font-size:12px;color:var(--text3)">${b.deutsch}</div>
        ${b.beispiel?`<div class="ar" style="font-size:14px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${b.beispiel}</div>`:''}
      </div>`).join('')||''}
      ${mehrData.verwandte&&mehrData.verwandte.length?`<div style="font-size:12px;font-weight:700;color:var(--text);margin:16px 0 10px">VERWANDTE WÖRTER (نفس الجذر)</div>
      ${mehrData.verwandte.map(w=>`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:12px;color:var(--text3)">${w.deutsch}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${w.wortart}</div></div>
        <div class="ar" style="font-size:22px;color:#60a5fa;font-weight:700">${w.arabisch}</div>
      </div>`).join('')}`:''}
    </div>`;
  }

  async function loadMehr(){
    window._mehrLoading=true;
    if(window._draw)window._draw();
    try{
      const raw=await callAI(`For the Arabic verb "${verb.arabic}" (${getTr(verb)}): Give meanings in different contexts and related words from the same root. Be CONCISE - max 3 bedeutungen entries and max 4 verwandte entries. Respond with ONLY a single JSON object, no markdown code fences, no other text, in exactly this format:
{"bedeutungen":[{"kontext":"short German label","arabisch":"short phrase with full diacritics","deutsch":"short German meaning","beispiel":"short example sentence with full diacritics"}],"verwandte":[{"arabisch":"related word with full diacritics","deutsch":"short German meaning","wortart":"Nomen or Adjektiv etc"}]}`,2000);
      const p=pJ(raw);
      if(p && (p.bedeutungen || p.verwandte)){ window._mehrData=p; window._mehrLoading=false; if(window._draw)window._draw(); }
      else { window._mehrLoading=false; window._mehrError='Antwort: '+raw.slice(0,300); if(window._draw)window._draw(); }
    }catch(e){ window._mehrLoading=false; window._mehrError='Fehler: '+e.message; if(window._draw)window._draw(); }
  }

  function showMehr(){ window._vt='mehr'; window._mehrData=verb.mehrData||window._mehrData; draw(); if(!window._mehrData&&!window._mehrLoading) loadMehr(); }
  window._draw=draw; window.loadMehr=loadMehr; window.showMehr=showMehr;
  draw();
}

function handleVerbFileUpload(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const isExcel=/\.(xlsx|xls)$/i.test(file.name);
  const reader=new FileReader();
  reader.onload=(e)=>{
    let words=[];
    if(isExcel){
      try{
        const data=new Uint8Array(e.target.result);
        const wb=XLSX.read(data,{type:'array'});
        wb.SheetNames.forEach(sheetName=>{
          const sheet=wb.Sheets[sheetName];
          const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
          rows.forEach(row=>row.forEach(cell=>{
            const s=String(cell||'').trim();
            if(s&&/[\u0600-\u06FF]/.test(s)) words.push(s);
          }));
        });
      }catch(err){ alert('Fehler beim Lesen der Excel-Datei: '+err.message); return; }
    } else {
      const text=e.target.result;
      words=text.split(/[\n,;]+/).map(w=>w.trim()).filter(w=>w&&/[\u0600-\u06FF]/.test(w));
    }
    words=[...new Set(words)];
    const ta=document.getElementById('vArIn');
    if(ta) ta.value=words.join('\n');
    if(!words.length) alert('Keine arabischen Wörter in der Datei gefunden.');
  };
  if(isExcel) reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
  event.target.value='';
}

async function addVerb(){
  const raw=document.getElementById('vArIn').value.trim();
  const tr=document.getElementById('vTrIn').value.trim();
  if(!raw)return;
  const words=[...new Set(raw.split(/[\n,]+/).map(w=>w.trim()).filter(Boolean))];
  if(!words.length)return;
  const btn=document.getElementById('addVerbBtn');
  btn.disabled=true;
  const newEntries=[]; const toGenerate=[];
  words.forEach(w=>{
    const cached=findExistingVerbData(w);
    if(cached){ newEntries.push({...cached,id:Date.now()+Math.floor(Math.random()*1000000)}); }
    else{ toGenerate.push(w); }
  });
  let generatedCount=0; let lastError=null;
  for(let i=0;i<toGenerate.length;i++){
    const w=toGenerate[i];
    btn.textContent=`KI erstellt Verb ${i+1}/${toGenerate.length}...`;
    try{
      const p=await generateVerbConjugation(w,tr);
      if(p){ newEntries.push({...p,id:Date.now()+Math.floor(Math.random()*1000000)}); generatedCount++; }
      else { lastError=new Error('KI-Antwort konnte nicht als JSON gelesen werden (evtl. abgeschnitten)'); }
    }catch(e){ lastError=e; }
  }
  if(newEntries.length){
    setVerbs([...newEntries,...getVerbs()]);
    document.querySelector('.overlay').remove();
    if(words.length>1) alert(`${newEntries.length} Verben hinzugefügt (${newEntries.length-generatedCount} bereits bekannt & sofort übernommen, ${generatedCount} neu von der KI erstellt).`);
    renderVerben(document.getElementById('app'));
  } else {
    alert('KI Fehler: '+(lastError?lastError.message:'unbekannt')); btn.textContent='Verben erstellen'; btn.disabled=false;
  }
}

[[NEUWORT:عربي:bedeutung auf Deutsch]]
Das Tag kommt ganz am Ende deiner Antwort, auf eigener Zeile. Bevorzuge es aber, komplett bei bekannten Wörtern zu bleiben, statt neue einzuführen. Benutze NIEMALS ein Wort außerhalb der Liste ohne diesen Tag.`;
  const corrFormat = `\nKorrektur-Format: Wenn der Lernende einen ECHTEN Fehler macht (falsches Wort, falsche Grammatik, NICHT fehlende Harakat), schreibe deine arabische Antwort normal, und füge danach in runden Klammern auf Deutsch eine SEHR KURZE Korrektur hinzu, z.B. "(Tipp: es heißt أَنَا أَيْضًا nicht أَنَا إِيضًا)". Maximal 10 Wörter in der Klammer. Wenn kein Fehler vorliegt, KEINE Klammer hinzufügen.`;

  if(n<=15) return `Du bist ein freundlicher Arabisch-Gesprächspartner für Anfänger.

- Antworte IMMER auf Arabisch mit vollständigen Vokalisierungszeichen.
- Maximal 1-2 kurze, natürliche Sätze.${corrFormat}${wordExplainNote}${noHarakatNote}`;
  if(n<=30) return `Du bist ein Arabisch-Gesprächspartner für Lernende mit Grundkenntnissen.
Regeln:
- Antworte IMMER auf Arabisch mit vollständigen Vokalisierungszeichen.
- 2 natürliche Sätze, stelle auch mal eine Frage.${corrFormat}${wordExplainNote}${noHarakatNote}`;
  return `Du bist ein Arabisch-Gesprächspartner für fortgeschrittene Lernende.

  vLoad=true; renderSprechen(document.getElementById('app'));
  try{
    const history=vMsgs.map(m=>`${m.role==='user'?'Lernender':'Bot'}: ${m.text}`).join('\n');
    const replyRaw=await callAI(getBotPrompt()+`\n\nGesprächsverlauf:\n${history}\n\nAntworte jetzt.`,300);
    let text2=replyRaw.trim();
    // Extract new word explanation tags [[NEUWORT:arabic:meaning]]
    const newWords=[];
    text2=text2.replace(/\[\[NEUWORT:([^:]+):([^\]]+)\]\]/g,(m,ar,de)=>{newWords.push({ar:ar.trim(),de:de.trim()});return '';}).trim();
    // Extract correction in () if present
    const corrMatch=text2.match(/\(([^)]+)\)\s*$/);
    const correction=corrMatch?corrMatch[1]:null;
    const arabicOnly=correction?text2.replace(/\s*\([^)]+\)\s*$/,'').trim():text2;
    // Safety net: check for unknown words that weren't tagged by the AI
    const unknownWords=findUnknownWords(arabicOnly, newWords);
    vMsgs.push({role:'ai',text:arabicOnly,correction,newWords,unknownWords});
    speakAr(arabicOnly);
  }catch{vMsgs.push({role:'ai',text:'أَعِدِ الْمُحَاوَلَةَ.'});}
  vLoad=false; renderSprechen(document.getElementById('app'));
}

// Safety net: find Arabic words in bot reply that aren't in known vocab and weren't tagged
const ALLOWED_BASE_WORDS=['أنا','أنت','أنتِ','هو','هي','نحن','هم','و','في','من','إلى','على','مع','لا','ما','مرحبا','نعم','لا','كيف','أين','شكرا','حسنا','جيد','هذا','هذه','هل','ماذا','متى','لماذا','كم','أنتما','أنتن','هما','هن'];
function findUnknownWords(text, taggedNewWords){
  const known=new Set(getVocabUpToHere().map(v=>stripH(v.arabic)));
  const taggedSet=new Set(taggedNewWords.map(w=>stripH(w.ar)));
  const allowedSet=new Set(ALLOWED_BASE_WORDS.map(w=>stripH(w)));
  // Split text into Arabic words, strip punctuation
  const words=text.match(/[\u0600-\u06FF]+/g)||[];
  const unknown=[];
  const seen=new Set();
  for(const w of words){
    const stripped=stripH(w);
    if(stripped.length<2) continue;
    if(known.has(stripped)||taggedSet.has(stripped)||allowedSet.has(stripped)) continue;
    if(seen.has(stripped)) continue;
    seen.add(stripped);
    unknown.push(w);
  }
  return unknown;
}

// Arabische Sprachausgabe — wählt die beste verfügbare Stimme aus
let _arVoicesCache=null;
let _preferredArVoice=null;

function _rankArVoice(v){
  // Bewertet Stimmen nach Qualität: Online/Natural-Stimmen sind meist besser als lokale Robot-Stimmen
  let score=0;
  const name=v.name.toLowerCase();
  if(!v.localService) score+=10; // Cloud-Stimmen klingen fast immer natürlicher
  if(name.includes('enhanced')||name.includes('premium')||name.includes('natural')) score+=8;
  if(name.includes('google')) score+=6; // Google-Stimmen sind auf Android/Chrome meist gut
  if(name.includes('siri')) score+=6; // Siri-Stimmen auf iOS sind meist gut
  if(v.lang==='ar-SA') score+=5; // Saudi-Arabisch ist oft die klarste Hochsprache-Aussprache
  else if(v.lang==='ar-EG') score+=3;
  else if(v.lang.startsWith('ar')) score+=2;
  if(name.includes('male')||name.includes('majed')||name.includes('tarik')||name.includes('hoda')||name.includes('laila')) score+=2;
  return score;
}

function _loadArVoice(){
  const all=speechSynthesis.getVoices();
  const arVoices=all.filter(v=>v.lang.toLowerCase().startsWith('ar'));
  if(arVoices.length===0) return null;
  _arVoicesCache=arVoices;
  // Falls der Nutzer bereits eine Stimme manuell gewählt hat, diese respektieren
  const saved=localStorage.getItem('preferredVoiceName');
  if(saved){
    const match=arVoices.find(v=>v.name===saved);
    if(match) return match;
  }
  const ranked=[...arVoices].sort((a,b)=>_rankArVoice(b)-_rankArVoice(a));
  return ranked[0];
}

// Versucht sofort zu laden; falls Stimmen noch nicht bereit sind, wartet auf das voiceschanged-Event
if(typeof speechSynthesis!=='undefined'){
  _preferredArVoice=_loadArVoice();
  speechSynthesis.onvoiceschanged=()=>{ _preferredArVoice=_loadArVoice(); };
}

function speakAr(text, opts){
  if(!text) return;
  opts=opts||{};
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ar-SA';
    u.rate=opts.rate||0.82;   // etwas langsamer als normal für bessere Verständlichkeit beim Lernen
    u.pitch=opts.pitch||1;
    u.volume=1;
    // Beste verfügbare Stimme neu prüfen, falls sie erst jetzt geladen wurde
    if(!_preferredArVoice) _preferredArVoice=_loadArVoice();
    if(_preferredArVoice) u.voice=_preferredArVoice;
    speechSynthesis.speak(u);
  }catch(e){
    console.warn('Sprachausgabe fehlgeschlagen:', e);
  }
}

// Zeigt an, welche Stimme aktuell verwendet wird (nützlich für Profil-Einstellungen)
function getCurrentArVoiceName(){
  if(_preferredArVoice) return _preferredArVoice.name+' ('+_preferredArVoice.lang+')';
  return 'Keine arabische Stimme gefunden — Systemstandard wird verwendet';
}

// Testet die aktuell gewählte Stimme mit einem Beispielsatz
window._testVoice=function(){

// Erlaubt manuelle Auswahl einer anderen verfügbaren Stimme
window._setVoice=function(idx){
  if(!_arVoicesCache) return;
  const chosen=_arVoicesCache[parseInt(idx)];
  if(chosen){
    _preferredArVoice=chosen;
    localStorage.setItem('preferredVoiceName', chosen.name);
    window._testVoice();
    render();
  }
};

function getChapterDescendantIds(chapters,chapterId){
  let ids=[chapterId];
  chapters.filter(c=>c.parentId===chapterId).forEach(s=>{ ids=ids.concat(getChapterDescendantIds(chapters,s.id)); });
  return ids;
}

// VOKABELN TEILEN — Export als Datei, Import mit Duplikat-Schutz
// ═══════════════════════════════════════════════════════
function exportVocab(){
  const data=JSON.stringify({exportedAt:new Date().toISOString(),app:'مركز اللغة',projects},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='meine-vokabeln-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImportVocab(){
  const input=document.getElementById('importFileInput');
  if(input) input.click();
}
function handleImportFile(event){
  const file=event.target.files&&event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      const importedProjects=data.projects||(Array.isArray(data)?data:null);
      if(!importedProjects||!importedProjects.length) throw new Error('Keine Projekte in dieser Datei gefunden.');
      let addedVocab=0, addedVerbs=0, skippedVocab=0, skippedVerbs=0;
      importedProjects.forEach(impProj=>{
        let target=projects.find(p=>p.name===impProj.name);
        if(!target){ target={id:Date.now()+Math.floor(Math.random()*100000),name:impProj.name,vocab:[],verbs:[]}; projects.push(target); }
        target.vocab=target.vocab||[]; target.verbs=target.verbs||[];
        const existingV=new Set(target.vocab.map(v=>stripH(v.arabic)));
        (impProj.vocab||[]).forEach(v=>{
          const key=stripH(v.arabic);
          if(!key||existingV.has(key)){ skippedVocab++; return; }
          target.vocab.push({...v,id:Date.now()+Math.floor(Math.random()*1000000),status:'neu',interval:1,easeFactor:2.5,repetitions:0,failCount:0,nextReview:0});
          existingV.add(key); addedVocab++;
        });
        const existingVb=new Set(target.verbs.map(v=>stripH(v.arabic)));
        (impProj.verbs||[]).forEach(v=>{
          const key=stripH(v.arabic);
          if(!key||existingVb.has(key)){ skippedVerbs++; return; }
          target.verbs.push({...v,id:Date.now()+Math.floor(Math.random()*1000000),status:'neu',interval:1,easeFactor:2.5,repetitions:0,failCount:0,nextReview:0});
          existingVb.add(key); addedVerbs++;
        });
      });
      saveProjects();
      alert(`Import fertig!\n✓ ${addedVocab} neue Vokabeln, ${addedVerbs} neue Verben hinzugefügt\n↷ ${skippedVocab+skippedVerbs} Duplikate übersprungen`);
      render();
    }catch(err){
      alert('Fehler beim Import: '+err.message);
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

WICHTIGE REGELN:
- Benutze NUR Wörter aus dieser Liste: ${vocabList}
- Erlaubt zusätzlich: أَنَا هُوَ هِيَ نَحْنُ وَ فِي مِنْ إِلَى عَلَى مَعَ هَذَا هَذِهِ لَا
- Jeder Satz: 4-6 Wörter, einfache Grammatik
- Antworte NUR mit JSON-Array ohne weitere Texte:
["جملة١", "جملة٢", "جملة٣", "جملة٤"]`;

    callAI(prompt, 500).then(raw=>{
      try{
        const cleaned=raw.replace(/```json|```/g,'').trim();

          loading: false

        <button onclick="window._diktatState=null;subView='diktat';render()" style="background:var(--gold);border:none;border-radius:12px;padding:12px 24px;color:#080c14;font-weight:700;cursor:pointer">Nochmal versuchen</button>
      </div>`;
    });

  }

  // ── PHASE: Results ──
  if(state.phase==='results'){
    const res=state.results||[];
    app.innerHTML=`<div style="padding:20px 16px 100px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
        <button onclick="subView='spiele';render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
        <div><div style="font-size:11px;color:var(--text3)">DIKTAT</div><div style="font-size:20px;font-weight:800;color:var(--text)">Ergebnis</div></div>

      ${res.map((r,i)=>`
        <div style="background:var(--bg2);border:1.5px solid ${r.korrekt?'#a3e635':'#ef4444'};border-radius:16px;padding:16px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:11px;font-weight:700;color:var(--text3)">SATZ ${i+1}</span>
            <span style="font-size:12px;font-weight:700;color:${r.korrekt?'#a3e635':'#ef4444'}">${r.korrekt?'✓ Richtig':'✗ Fehler'}</span>
          </div>
          <div class="ar" style="font-size:16px;color:var(--gold);margin-bottom:8px;line-height:1.8">Richtig: ${state.sentences[i]}</div>
          ${state.images&&state.images[i]?`<img src="${state.images[i]}" style="width:100%;max-height:120px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--border);margin-bottom:8px"/>`:''}
          ${r.feedback?`<div style="font-size:12px;color:#94a3b8;line-height:1.6;padding-top:8px;border-top:1px solid var(--border)">${r.feedback}</div>`:''}
        </div>`).join('')}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
        <button onclick="window._diktatState=null;subView='diktat';render()" style="background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;padding:14px;color:#080c14;font-weight:800;font-size:14px;cursor:pointer">Neues Diktat</button>
        <button onclick="subView='spiele';render()" style="background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-weight:700;font-size:14px;cursor:pointer">Zurück</button>
      </div>`}
    </div>`;
    return;
  }

  // ── PHASE: Dictate (Satz für Satz) ──
  const idx=state.currentIdx;
  const total=state.sentences.length;
  const pct=Math.round((idx/total)*100);

  app.innerHTML=`<div style="padding:20px 16px 100px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:6px">
      <button onclick="subView='spiele';render()" style="background:var(--bg3);border:none;color:var(--text2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:16px">←</button>
      <div style="flex:1">
        <div style="font-size:11px;color:var(--text3)">DIKTAT · SATZ ${idx+1} VON ${total}</div>
        <div style="background:var(--bg3);border-radius:4px;height:4px;margin-top:6px">
          <div style="width:${pct}%;background:var(--gold);height:4px;border-radius:4px"></div>
        </div>
      </div>
    </div>

    <!-- Audio area -->
    <div style="background:linear-gradient(135deg,#1a1200,#2a1f00);border:2px solid var(--gold);border-radius:22px;padding:32px 24px;margin-bottom:20px;text-align:center">
      <div style="margin-bottom:16px">${icon('mic',48,'var(--gold)',1.5)}</div>
      <div style="font-size:16px;font-weight:700;color:var(--gold);margin-bottom:8px">Höre den Satz</div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:24px">Noch ${state.playsLeft} ${state.playsLeft===1?'Wiederholung':'Wiederholungen'} möglich</div>
      <button id="replayBtn" onclick="window._diktatReplay()" style="background:${state.playsLeft>0?'var(--gold)':'var(--bg3)'};border:none;border-radius:14px;padding:14px 32px;color:${state.playsLeft>0?'#080c14':'var(--text3)'};font-weight:800;font-size:15px;cursor:${state.playsLeft>0?'pointer':'default'}">${state.playsLeft>0?'Nochmal hören':'Kein Replay mehr'}</button>
    </div>

    <!-- Write answer by hand -->
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">Schreibe den Satz von Hand:</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Mit Buchstaben und Harakat</div>
    <canvas id="diktatCanvas" width="600" height="400" style="width:100%;height:260px;background:#fff;border-radius:14px;border:1.5px solid var(--border);touch-action:none;display:block"></canvas>
    <button onclick="window._diktatClear()" style="width:100%;margin-top:8px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--text);font-weight:700;font-size:13px;cursor:pointer">🗑 Löschen</button>

    <!-- Next / Submit -->
    <div style="margin-top:12px">
      ${idx<total-1
        ? `<button onclick="window._diktatNext()" style="width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:14px;padding:16px;color:#080c14;font-weight:900;font-size:16px;cursor:pointer">Weiter →</button>`
        : `<button onclick="window._diktatSubmit()" style="width:100%;background:linear-gradient(135deg,#a3e635,#65a30d);border:none;border-radius:14px;padding:16px;color:#080c14;font-weight:900;font-size:16px;cursor:pointer">Abschicken & Korrigieren ✓</button>`
      }
    </div>
  </div>`;

  // Canvas-Setup: Zeichnen per Maus/Finger/Stift
  (function(){
    const canvas=document.getElementById('diktatCanvas');
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    // Restore previous drawing if present
    if(state.images && state.images[idx]){
      const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src=state.images[idx];
    }
    ctx.strokeStyle='#111'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
    let drawing=false,lastX=0,lastY=0;
    function getPos(e){
      const rect=canvas.getBoundingClientRect();
      const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
      return {x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy};
    }
    function start(e){ drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; }
    function move(e){ if(!drawing)return; const p=getPos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; e.preventDefault(); }
    function end(){ drawing=false; }
    canvas.addEventListener('pointerdown',start);
    canvas.addEventListener('pointermove',move);
    canvas.addEventListener('pointerup',end);
    canvas.addEventListener('pointerleave',end);
    window._diktatCanvasEl=canvas;
  })();

  window._diktatClear=function(){
    const c=document.getElementById('diktatCanvas'); if(!c)return;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  };

  // Bind functions
  window._diktatReplay=function(){
    if(state.playsLeft<=0) return;

    state.currentIdx++;
    state.playsLeft=2;
    renderDiktat(document.getElementById('app'));
    // Auto-play next sentence
    setTimeout(()=>diktatSpeak(state.sentences[state.currentIdx], state),600);

  window._diktatSubmit=async function(){
    const c=document.getElementById('diktatCanvas');
    if(c) state.images[idx]=c.toDataURL('image/png');
    state.phase='results';
    state.loading=true;
    renderDiktat(document.getElementById('app'));

    // Vision-based correction: read each handwritten sentence and compare to the original
    const results=[];
    for(let i=0;i<state.sentences.length;i++){
      const dataUrl=state.images[i];
      if(!dataUrl){ results.push({korrekt:false,feedback:'Kein Satz geschrieben.'}); continue; }
      const base64=dataUrl.split(',')[1];
      try{
        const raw=await callAI(`A learner heard an Arabic sentence and wrote it by hand. The correct sentence is: "${state.sentences[i]}". Read the handwriting in the image and compare it to the correct sentence, INCLUDING the harakat (diacritics). Decide if it is correct (allow minor handwriting-shape imperfections, but DO check that the letters and harakat match). Reply ONLY JSON: {"korrekt":true/false,"feedback":"short German feedback; if letters or harakat are wrong/missing, say which"}`,400,[{media_type:'image/png',data:base64}]);
        const parsed=pJ(raw);
        results.push(parsed?{korrekt:!!parsed.korrekt,feedback:parsed.feedback||''}:{korrekt:false,feedback:'Konnte nicht gelesen werden.'});
      }catch(e){
        results.push({korrekt:false,feedback:'Fehler bei der Prüfung.'});
      }
    }
    state.results=results;
    state.loading=false;
    renderDiktat(document.getElementById('app'));
  };
}

function diktatSpeak(text, state){
  if(!text) return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='ar-SA'; utt.rate=0.8; utt.pitch=1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utt);
}

  function end(){ drawing=false; }
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',move);
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointerleave',end);

  window._hsClear=function(){
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  };

  window._hsSubmit=async function(){
    const btn=document.getElementById('hsSubmitBtn');
    btn.textContent='KI prüft...'; btn.disabled=true;
    const dataUrl=canvas.toDataURL('image/png');
    const base64=dataUrl.split(',')[1];
    try{
      const raw=await callAI(`This image shows Arabic handwriting by a language learner practicing the word "${word.arabic}" (${word.tr}). Judge if the handwriting is legible and matches this word's letters AND its harakat (diacritical marks: fatha, kasra, damma, sukun, shadda, tanwin). Be encouraging about letter-shape imperfections, but DO check whether the harakat are present and placed on the right letters. Reply ONLY JSON: {"correct":true/false,"feedback":"short encouraging German feedback; if harakat are missing or wrong, say which"}`,300,[{media_type:'image/png',data:base64}]);
      const parsed=pJ(raw);
      state.results[idx]={correct:parsed?!!parsed.correct:false,feedback:parsed?parsed.feedback:'Konnte nicht geprüft werden.',img:dataUrl};
    }catch(e){
      state.results[idx]={correct:false,feedback:'Fehler bei der Prüfung: '+e.message,img:dataUrl};
    }
    if(idx<total-1){ state.currentIdx++; renderHandschreiben(document.getElementById('app')); }
    else{ state.phase='results'; renderHandschreiben(document.getElementById('app')); }
  };
}

function renderStats(app){

  const lernend=vocab.filter(v=>v.status==='lernend').length;
  const neu=vocab.filter(v=>v.status==='neu').length;
  const total=vocab.length;
  const due=vocab.filter(isDue).length;

  // Build heatmap data — last 12 weeks (84 days)
  const today=new Date(); today.setHours(0,0,0,0);
  const history=JSON.parse(localStorage.getItem('reviewHistory')||'{}');
  const heatDays=[];
  for(let i=83;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    heatDays.push({date:key,count:history[key]||0});
  }
  const maxCount=Math.max(1,...heatDays.map(d=>d.count));

  function heatColor(c){
    if(c===0) return 'var(--bg3)';
    const pct=c/maxCount;
    if(pct<0.25) return '#854d0e';
    if(pct<0.5) return '#a16207';
    if(pct<0.75) return '#ca8a04';

      <input id="authEmail" type="email" placeholder="E-Mail-Adresse" style="margin-bottom:10px" autocomplete="email"/>

      <div style="text-align:center;font-size:13px;color:var(--text3)">
